<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Marketplace Los Mochis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: red social local. Barra lateral (escritorio) / barras arriba y abajo (celular); feed central de 470px; columna derecha de negocios. */
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EEF1EC; --surface-3:#E3E8E1; --fg:#14201C; --muted:#5D6B66; --line:#DDE3DE;
  --brand:#0D6B5B; --brand-ink:#FFFFFF; --brand-soft:#D7EEE7; --accent:#D9480F; --accent-soft:#FFE8DA;
  --ok:#15803D; --ok-soft:#DCF3E3; --warn:#A16207; --warn-soft:#FBF0D3; --bad:#C0262D; --bad-soft:#FCE3E3;
  --star:#D97706; --like:#E11D48; --verif:#1D9BF0;
  --shadow:0 1px 2px rgba(20,32,28,.05),0 8px 28px rgba(20,32,28,.08);
  --ring-a:#F59E0B; --ring-b:#E11D48; --ring-c:#0D6B5B;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F0E; --surface:#131A18; --surface-2:#1A2320; --surface-3:#24302C; --fg:#E7EEEB; --muted:#94A39E; --line:#24302C;
  --brand:#41C3A8; --brand-ink:#04211B; --brand-soft:#123A32; --accent:#FF8A4C; --accent-soft:#3A2217;
  --ok:#4ADE80; --ok-soft:#13311F; --warn:#FBBF24; --warn-soft:#352A12; --bad:#F87171; --bad-soft:#3A1919;
  --star:#FBBF24; --like:#FB7185; --verif:#4CB4F5; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F0E; --surface:#131A18; --surface-2:#1A2320; --surface-3:#24302C; --fg:#E7EEEB; --muted:#94A39E; --line:#24302C;
  --brand:#41C3A8; --brand-ink:#04211B; --brand-soft:#123A32; --accent:#FF8A4C; --accent-soft:#3A2217;
  --ok:#4ADE80; --ok-soft:#13311F; --warn:#FBBF24; --warn-soft:#352A12; --bad:#F87171; --bad-soft:#3A1919;
  --star:#FBBF24; --like:#FB7185; --verif:#4CB4F5; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;transition:background .2s}
body.big{zoom:1.12}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:800} h2{font-size:19px;font-weight:800}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
code{background:var(--surface-2);padding:0 4px;border-radius:4px;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .08s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.soft{background:var(--surface-2);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:13px 18px;font-size:15.5px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lk{background:none;border:0;padding:2px 0;color:var(--brand);font-weight:700;font-size:13.5px}
.lk.mut{color:var(--muted);font-weight:600}
.ibtn{position:relative;display:grid;place-items:center;background:none;border:0;padding:8px;border-radius:12px;color:var(--fg)}
.ibtn:hover{background:var(--surface-2)}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
label.f span.h{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:15px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
input[type=file]{font-size:13.5px;max-width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:18px;height:18px;flex:none}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.err{color:var(--bad);font-size:13.5px;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px}

/* piezas comunes */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.br{background:var(--brand-soft);color:var(--brand)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.todo{display:inline-flex;align-items:center;border:1px dashed var(--warn);color:var(--warn);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
.badge{position:absolute;top:2px;right:2px;background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:800;border:2px solid var(--bg)}
.verif{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--verif);color:#fff;font-size:10px;font-weight:900;vertical-align:-2px;margin-left:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.note b{color:var(--brand)}
.note.warn{background:var(--warn-soft)} .note.warn b{color:var(--warn)}
.note.bad{background:var(--bad-soft)} .note.bad b{color:var(--bad)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:19px}
.avatar{width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;display:inline-grid;place-items:center;font-weight:800;flex:none;overflow:hidden;font-family:var(--display);font-size:calc(var(--s,40px) * .38);letter-spacing:.01em}
.avatar.biz{border-radius:28%}
.avatar{position:relative}
.uimg{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover;display:block}
.avatar img,.avatar svg{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:pop .2s ease-out}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;min-width:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{font-weight:600;opacity:.65}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px}
.search input{border:0;background:none;padding:10px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.segs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px;align-self:center}
.segs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:700;color:var(--muted);font-size:14px}
.segs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--surface-3);border:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch.on{background:var(--brand)} .switch.on::after{left:23px}

/* shell */
:root{--sw:0px}
@media (min-width:768px){:root{--sw:78px}}
@media (min-width:1280px){:root{--sw:244px}}
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--bg);border-right:1px solid var(--line);z-index:25;display:none;flex-direction:column;gap:2px;padding:22px 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:768px){.side{display:flex}}
.logo2{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 12px 26px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--fg)}
.mark{flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 50%,var(--accent)));color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:800}
.nv{position:relative;display:flex;align-items:center;gap:16px;background:none;border:0;border-radius:12px;padding:12px;color:var(--fg);font-size:15.5px;text-align:left;width:100%;transition:background .15s}
.nv:hover{background:var(--surface-2)}
.nv:hover svg{transform:scale(1.06)}
.nv svg{flex:none;transition:transform .15s}
.nv.on{font-weight:800}
.nv.on svg{stroke-width:2.6}
.nv .badge{top:5px;left:27px;right:auto}
.side .grow{flex:1}
@media (max-width:1279px){.side .lbl,.side .logo2 .txt{display:none}.side .logo2{justify-content:center;padding-inline:0}.nv{justify-content:center}}
.menu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;min-width:250px;display:flex;flex-direction:column}
.menu button,.menu .mi{display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px;border-radius:10px;text-align:left;font-weight:600;color:var(--fg);width:100%}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px;width:auto}
.menu .sp{flex:1}
.igmain{margin-left:var(--sw);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){.igmain{padding-bottom:40px}}
.igin{max-width:1010px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.mtop .logo2{padding:4px 0;font-size:20px}
.mtop .sp{flex:1}
@media (min-width:768px){.mtop{display:none}}
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.mnav button{position:relative;background:none;border:0;padding:5px 6px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;min-width:58px}
.mnav button.on{color:var(--fg)}
.mnav .badge{top:0;right:8px}
@media (min-width:768px){.mnav{display:none}}
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--accent);color:var(--muted);border-radius:12px;padding:6px 6px 6px 12px;font-size:12.5px}
.protobar b{color:var(--accent)}
.modes{margin-left:auto;display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted)}
.modes button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.cartfloat{position:fixed;z-index:39;left:calc(var(--sw) + 16px);right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;display:flex;justify-content:space-between;align-items:center;background:var(--brand);color:var(--brand-ink);border:0;border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:var(--shadow)}
@media (min-width:768px){.cartfloat{bottom:22px}}

/* inicio */
.home{display:flex;justify-content:center;gap:56px;align-items:flex-start}
.home-feed{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;min-width:0}
.home-side{width:320px;flex:none;display:none;flex-direction:column;gap:14px;padding-top:6px;position:sticky;top:16px}
@media (min-width:1180px){.home-side{display:flex}}
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 2px}
.stb{flex:none;width:74px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--fg)}
.stb .nm{font-size:12px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;padding:3px;border-radius:50%;background:conic-gradient(from 210deg,var(--ring-a),var(--ring-b),var(--ring-c),var(--ring-a));transition:transform .15s}
.stb:hover .ring{transform:scale(1.04)}
.ring.biz{border-radius:30%}
.ring.seen{background:var(--line)}
.ring.none{background:transparent}
.ring>.avatar{border:3px solid var(--bg);box-sizing:content-box}
.ring .addst{position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:2px solid var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1}
.srow{display:flex;align-items:center;gap:12px}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:flex;align-items:center;gap:2px;font-size:14px;white-space:nowrap;overflow:hidden}
.srow .tx span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{font-size:11.5px;color:var(--muted);line-height:1.8}
.compose{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 12px;text-align:left;width:100%;color:var(--muted)}
.compose span.t{flex:1}

/* negocios destacados */
.bizrail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;scroll-snap-type:x mandatory}
.bcard2{flex:0 0 220px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.bcard2:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bcard2 .cv{position:relative;aspect-ratio:16/10}
.bcard2 .cv svg,.bcard2 .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bcard2 .cv .avatar{position:absolute;left:12px;bottom:-18px;border:3px solid var(--surface);box-sizing:content-box}
.bcard2 .cv .pill{position:absolute;top:10px;left:10px}
.bcard2 .in{padding:24px 12px 12px;display:flex;flex-direction:column;gap:2px}
.bcard2 b{font-size:15px}
.recom{background:linear-gradient(135deg,var(--brand-soft),var(--accent-soft));border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.recom h3{font-size:17px}

/* publicaciones */
.feed{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.post-h{display:flex;align-items:center;gap:10px;padding:8px 2px}
.post-h .who{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:10px;color:var(--fg)}
.post-h .who b{font-size:14.5px}
.post-h .who .small{display:block}
.car{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car-track>.ph{flex:0 0 100%;scroll-snap-align:start}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--surface-2);overflow:hidden}
.ph img,.ph svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.car-n{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.car-b{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-weight:800;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.car:hover .car-b{opacity:1}
.car-b.l{left:8px}.car-b.r{right:8px}
.bigheart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);color:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));pointer-events:none}
.bigheart.go{animation:bh .8s ease-out}
@keyframes bh{30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.dots{display:flex;justify-content:center;gap:5px;padding-top:8px;min-height:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .15s}
.dots i.on{background:var(--brand)}
.post-a{display:flex;gap:2px;align-items:center;margin-top:-14px}
.post-a button{background:none;border:0;display:flex;align-items:center;gap:6px;padding:8px;font-weight:700;color:var(--fg);border-radius:10px}
.post-a button:hover{background:var(--surface-2)}
.post-a button.on{color:var(--like)}
.post-a button.on svg{animation:hp .3s}
@keyframes hp{50%{transform:scale(1.3)}}
.post-a .sp{flex:1}
.post-b{padding:2px 2px 2px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.post-b .lnk{background:none;border:0;padding:0;color:var(--muted);text-align:left;font-size:14px}
.buy{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--brand-soft);color:var(--fg);border-radius:14px;padding:12px 14px;font-weight:800;text-align:left;width:100%;transition:filter .15s}
.buy:hover{filter:brightness(.97)}
.buy span:last-child{color:var(--brand);white-space:nowrap}

.stv{position:fixed;inset:0;z-index:70;background:#121212;color:#fff;display:flex;align-items:center;justify-content:center;gap:26px;padding:calc(12px + env(safe-area-inset-top,0px)) 8px calc(12px + env(safe-area-inset-bottom,0px));animation:fd .15s}

const MEDIA = {};

  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('lm-fotos',1); r.onupgradeneeded=()=>r.result.createObjectStore('m'); r.onsuccess=()=>{IDB.db=r.result;res();}; r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); },

  get(k){ return new Promise(res=>{ try{ const r=IDB.db.transaction('m').objectStore('m').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);}catch(e){res(null);} }); }

async function cargarFotos(){
  try { await IDB.open(); } catch(e){ return; }

/* ============================================================
   SEGURIDAD DEL TEXTO (SERVIDOR en la versión real)
   1) Normaliza trucos para esconder enlaces: "punto com", [.], espacios, letras raras, caracteres invisibles.
   2) Bloquea: enlaces, correos, direcciones IP, contenido +18 u ofensivo, y teléfonos en lugares públicos.
   3) Advierte (sin bloquear) cuando un mensaje pide códigos, contraseñas o dinero.
   El texto SIEMPRE se muestra como texto plano: nunca se convierte en enlace ni en código.
   ============================================================ */
/* limpiarTexto, analizarTexto, revisar y msgBloqueo viven en escudo.js */
function nombreSeguro(nombre, usuario){
  const s = limpiarTexto(nombre+' '+usuario);
  if (/(soporte|admin|moderador|oficial|verificad|seguridad|ayuda)/.test(s) || s.includes(slug(S.cfg.marca))) return 'Ese nombre podría confundirse con una cuenta oficial. Elige otro.';
  return '';
}
const RATE = {}; // límite de velocidad: máximo 6 mensajes cada 20 segundos
function permitirEnvio(){ const now=Date.now(); const l=(RATE[S.yo]||[]).filter(t=>now-t<20000); if (l.length>=6) return false; l.push(now); RATE[S.yo]=l; return true; }
function senalesPublicidad(texto){
  const t = limpiarTexto(texto); const s = [];
  if (RE_TEL.test(t)) s.push('teléfono');
  if (/\$\s?\d/.test(t)) s.push('precio');
  ['promo','oferta','descuento','2x1','whatsapp','mandame mensaje','inbox','vendo','venta','envio gratis','pedidos al','gana dinero','desde casa'].forEach(w=>{ if(t.includes(w)) s.push(`“${w}”`); });
  return [...new Set(s)];
}

/* ============================================================
   MODERACIÓN AUTOMÁTICA (activable). La decisión final sigue siendo del administrador.
   - Rechaza sola: enlaces, correos, contenido +18/ofensivo, publicidad clara (2+ señales).
   - Manda a revisión manual: casos dudosos (1 señal, autor con avisos, fotos subidas que aún no analiza un servicio de imágenes).
   - Aprueba sola: lo demás. Todo queda en "Decisiones automáticas" para poder revertirlo.
   ============================================================ */
function evaluar(item, tipoItem){
  const texto = item.texto||''; const r = analizarTexto(texto,'publico'); const autorUsr = !esNeg(item.autor) ? usr(item.autor) : null;
  const ad = autorUsr ? senalesPublicidad(texto) : [];
  const fotosSubidas = tipoItem==='hist' ? !!item.foto.m : item.fotos.some(f=>f.m);
  const grave = ['menores','grooming','explotacion','drogas','armas','violencia'].find(c=>r.bloqueos.includes(c));
  if (grave) return {d:'rechazado', motivo:{grooming:'menores',violencia:'ofensivo'}[grave]||grave, razon:'Escudo: '+ETIQ[grave]+(r.oculto?' (intento de burlar el filtro)':'')};
  if (r.bloqueos.includes('adulto')||r.bloqueos.includes('ofensivo')) return {d:'rechazado', motivo:r.bloqueos.includes('adulto')?'adulto':'ofensivo', razon:'Texto con contenido +18 u ofensivo'};
  if (r.bloqueos.some(b=>['enlace','correo','dirección IP'].includes(b))) return {d:'rechazado', motivo:'enlace', razon:'Contiene enlace o correo'};
  if (r.oculto || r.avisos.includes('drogas')) return {d:'pendiente', razon:r.oculto?'Posible intento de burlar el filtro':'Menciona posibles drogas'};
  if (ad.length>=2) return {d:'rechazado', motivo:'publicidad', razon:'Publicidad: '+ad.join(', ')};
  if (r.avisos.includes('posible estafa')) return {d:'pendiente', razon:'Palabras de posible estafa'};
  if (ad.length===1) return {d:'pendiente', razon:'Posible publicidad: '+ad[0]};
  if (autorUsr && autorUsr.strikes>0) return {d:'pendiente', razon:`Autor con ${autorUsr.strikes} aviso(s)`};
  if (fotosSubidas) return {d:'aprobado', razon:'Texto limpio · imagen sin analizar (falta conectar servicio)', revisarFoto:true};
  return {d:'aprobado', razon:'Sin señales de riesgo'};
}
function aplicarDecision(item, tipoItem, ev, por){
  const antes = item.estado; item.estado = ev.d; item.mod = {por, razon:ev.razon, t:Date.now(), antes};
  if (ev.d==='aprobado') item.t = Date.now();
  if (ev.d==='rechazado'){ item.motivo = ev.motivo; strike(item.autor, ev.motivo); }
  if (por==='auto') S.decisiones.unshift({tipo:tipoItem, id:item.id, d:ev.d, razon:ev.razon, t:Date.now(), revisarFoto:!!ev.revisarFoto});
  const que = tipoItem==='hist'?'Tu historia':'Tu publicación';
  if (ev.d!=='pendiente') notif(item.autor,'sistema',null,{texto:`${que} fue ${ev.d==='aprobado'?'aprobada':'rechazada: '+MOTIVOS[ev.motivo]}.`, post:tipoItem==='post'?item.id:null});
  log(por==='auto'?'Moderación automática':'Admin', `${tipoItem==='hist'?'Historia':'Publicación'} ${ev.d}`, `${item.id} · ${perfilDe(item.autor).nombre} · ${ev.razon||''}`);
}
function strike(autor, motivo){
  if (esNeg(autor) || !['publicidad','adulto','enlace','estafa','menores','drogas','armas','explotacion','ofensivo'].includes(motivo)) return '';
  const u=usr(autor); u.strikes++; if(u.strikes>=S.cfg.strikesMax){ u.subidas=false; return ` · ${u.strikes}/${S.cfg.strikesMax} avisos · publicaciones bloqueadas`; } return ` · aviso ${u.strikes}/${S.cfg.strikesMax}`;
}
function moderarNuevo(item, tipoItem){
  const esN = esNeg(item.autor);
  if (S.cfg.autoMod){ aplicarDecision(item, tipoItem, evaluar(item,tipoItem), 'auto'); return item.estado; }
  item.estado = (esN && !S.cfg.revisarNeg) ? 'aprobado' : 'pendiente';
  return item.estado;
}
function procesarPendientes(){
  let n=0; S.posts.filter(p=>p.estado==='pendiente').forEach(p=>{ const ev=evaluar(p,'post'); if(ev.d!=='pendiente'){ aplicarDecision(p,'post',ev,'auto'); n++; } });
  S.historias.filter(h=>h.estado==='pendiente').forEach(h=>{ const ev=evaluar(h,'hist'); if(ev.d!=='pendiente'){ aplicarDecision(h,'hist',ev,'auto'); n++; } });
  return n;
}

/* ---------- SERVIDOR (simulado): precios, envíos y pedidos ---------- */
function precioUnitario(p, sel){
  let c = p.precio;
  p.var.forEach((ax,i)=>{ const op = ax.o.find(x=>x.n===sel.v[i]); if(op) c += op.d; });
  p.mods.forEach((g,i)=>{ (sel.m[i]||[]).forEach(nm=>{ const op=g.o.find(x=>x.n===nm); if(op) c += op.d; }); });
  return c;
}
function validarSel(p, sel){
  if (!p.disp || p.stock===0) return 'Este producto no está disponible.';
  for (let i=0;i<p.var.length;i++) if(!sel.v[i]) return `Elige ${p.var[i].n.toLowerCase()}.`;
  if (p.var.length && p.agot.includes(sel.v.join('|'))) return 'Esa combinación está agotada.';
  for (let i=0;i<p.mods.length;i++){ const n=(sel.m[i]||[]).length, g=p.mods[i]; if(n<g.min) return `Elige ${g.n.toLowerCase()}.`; if(n>g.max) return `Máximo ${g.max} en ${g.n.toLowerCase()}.`; }
  if (p.stock!=null && sel.qty > p.stock) return `Solo quedan ${p.stock}.`;
  return '';
}
function costoEnvio(n, colonia, subtotal){
  if (!n.entrega) return null;
  const z = (n.zonas||[]).find(z=>z.col.toLowerCase()===String(colonia||'').toLowerCase());
  let c = z ? z.costo : n.envio;
  if (n.envioGratis && subtotal >= n.envioGratis) c = 0;
  return c;
}
const comision = subtotal => Math.round(subtotal * S.cfg.comisionBps / 10000);
const subtotalCarrito = () => S.carrito ? S.carrito.items.reduce((a,it)=>a+Math.round(precioUnitario(prod(it.pid),it.sel)*it.qty),0) : 0;
function crearPedido(datos){
  const c = S.carrito; const n = neg(c.neg);
  if (!n || n.estado!=='activo') throw new Error('Este negocio no está recibiendo pedidos.');
  if (n.id===S.yo) throw new Error('No puedes pedirle a tu propio negocio.');
  const items = c.items.map(it=>{
    const p = prod(it.pid); if(!p || p.neg!==c.neg) throw new Error('Un producto ya no existe.');
    const e = validarSel(p,{...it.sel, qty:it.qty}); if(e) throw new Error(p.nombre+': '+e);
    const u = precioUnitario(p,it.sel);
    return {nombre:p.nombre, det:it.det, nota:it.nota, qty:it.qty, unidad:p.unidad, unit:u, total:Math.round(u*it.qty)};
  });
  const subtotal = items.reduce((a,b)=>a+b.total,0);
  if (n.pedidoMin && subtotal < n.pedidoMin) throw new Error(`El pedido mínimo de ${n.nombre} es ${money(n.pedidoMin)}.`);
  let envio = datos.modo==='entrega' ? costoEnvio(n, datos.colonia, subtotal) : 0, repInfo = null;
  if (datos.modo==='reparto'){
    if (!n.repartoApp) throw new Error('Este negocio no usa repartidores de la app.');
    const km = kmDe(datos.colonia), min = minimoEnvio(km);
    if (!(datos.oferta >= min)) throw new Error(`La oferta mínima de envío es ${money(min)}.`);
    envio = datos.oferta; repInfo = {km, minimo:min, oferta:envio, seguro:seguroDe(envio), estado:'esperando_tienda', ofertas:[], rep:null, pasos:[{s:'esperando_tienda',t:Date.now()}], sim:0};
  }
  const id = 'LM-' + (++S.seq);
  const ped = {id, neg:n.id, items, subtotal, envio, total:subtotal+envio+(repInfo?repInfo.seguro:0), rep:repInfo, codigo:genCodigo(), comision:comision(subtotal), modo:datos.modo, pago:datos.pago,
    cambio:datos.cambio, cliente:{nombre:datos.nombre, tel:datos.tel, calle:datos.calle, colonia:datos.colonia, ref:datos.ref}, nota:datos.nota,
    origen:c.origen||null, cuenta:S.yo, estado:'recibido', hist:[{s:'recibido', t:Date.now()}], creado:Date.now()};
  c.items.forEach(it=>{ const p=prod(it.pid); if(p.stock!=null) p.stock = Math.max(0, +(p.stock - it.qty).toFixed(2)); });
  S.pedidos.unshift(ped); S.carrito = null;
  notif(n.id,'pedido',S.yo,{texto:`Nuevo pedido #${id} por ${money(ped.total)}`});
  log('Cliente '+datos.nombre, 'Pedido creado', `${id} en ${n.nombre} · ${money(ped.total)}${ped.origen?' · desde publicación':''}`);
  return ped;
}

const esc2 = w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const reTerm = w => { const completa = w.endsWith('$'); const t = w.replace(/\$$/,''); return new RegExp('(^|[^a-z0-9ñ])'+esc2(t)+(completa?'(?![a-z0-9ñ])':'')); };
const CACHE_RE = new Map(); const rt = w => { if(!CACHE_RE.has(w)) CACHE_RE.set(w, reTerm(w)); return CACHE_RE.get(w); };
function busca(v, lista){ // devuelve {hit, oculto}: oculto = solo apareció al normalizar (intento de burlar)
  for (const w of lista){
    const completa = w.endsWith('$'), t = w.replace(/\$$/,''), td = dedup(t);
    const reND = rt(w), reD = td.length>=4 ? rt(td+(completa?'$':'')) : null;
    if (reND.test(v.palND) || reND.test(v.sinLeet) || (reD && reD.test(v.pal))){
      const enCrudo = reND.test(v.crudo) || (reD && reD.test(dedup(v.crudo)));
      return {hit:w, oculto:!enCrudo};
    }
    const tp = td.replace(/[^a-zñ]/g,'');
    if (tp.length>=7 && /^[a-zñ ]+$/.test(td) && v.pegado.includes(tp)) return {hit:w, oculto:true};
  }
  return null;
}

function analizarTexto(t, lugar, ctx={}){
  // lugar: 'publico' (publicaciones, comentarios, notas, perfil, negocio) o 'privado' (mensajes)
  const v = vistas(t), bloqueos = [], avisos = [], pistas = []; let oculto = false;
  const marca = (cat, res, lista=bloqueos) => { if(!lista.includes(cat)) lista.push(cat); if(res){ pistas.push(res.hit); if(res.oculto) oculto = true; } };
  // datos de contacto
  if (RE_LINK.test(v.base) || RE_LINK.test(v.sinEsp)) marca('enlace', {hit:'enlace', oculto:!RE_LINK.test(v.crudo)});
  if (RE_MAIL.test(v.base) || RE_MAIL.test(v.sinEsp)) marca('correo', {hit:'correo', oculto:!RE_MAIL.test(v.crudo)});
  if (RE_IP.test(v.base)) marca('dirección IP');
  const tel = RE_TEL.test(v.base) || RE_TEL_NUM.test(v.numerica);
  if (tel){ const res={hit:'teléfono', oculto:!RE_TEL.test(v.crudo)}; (lugar==='publico' || res.oculto || ctx.paraMenor) ? marca('teléfono',res) : marca('teléfono',null,avisos); }
  // diccionarios fijos + términos que agregó el admin
  for (const [cat, lista] of Object.entries(DIC)){ const r = busca(v, lista.concat(S.cfg.terminos.filter(x=>x.cat===cat).map(x=>x.t))); if (r) marca(cat, r); }
  // contexto
  const venta = hay(v, VENTA) || emoCuenta(v.emojis,'venta')>0 || /\$\s?\d/.test(v.base);
  const sexual = hay(v, SEXUAL) || emoCuenta(v.emojis,'sexo')>0;
  const menorCtx = busca(v, DIC_CTX.menor) || (emoCuenta(v.emojis,'menor')>0 ? {hit:'emoji', oculto:true} : null);
  const drogaCtx = busca(v, DIC_CTX.drogas), armaCtx = busca(v, DIC_CTX.armas);
  if (drogaCtx && venta) marca('drogas', drogaCtx); else if (drogaCtx && !DIC_CTX.drogasDebil.includes(drogaCtx.hit)) marca('drogas', null, avisos);
  if (armaCtx && venta) marca('armas', armaCtx); else if (armaCtx && lugar==='publico' && hay(v,['vendo','venta'])) marca('armas', armaCtx);
  if (menorCtx && (sexual || bloqueos.includes('adulto'))) marca('menores', menorCtx);
  const cp = busca(v, ['cp$','pthc$']); if (cp && hay(v, ['vendo','tengo','paso','link','carpeta','mega$','drive$','intercambio','videos','pack','packs$'])) marca('menores', cp);
  // emojis en clave
  const eD=emoCuenta(v.emojis,'droga'), eV=emoCuenta(v.emojis,'venta'), eS=emoCuenta(v.emojis,'sexo'), eM=emoCuenta(v.emojis,'menor'), eA=emoCuenta(v.emojis,'arma');
  if (eD && (eV || venta)) marca('drogas', {hit:'emojis', oculto:true});
  else if (eD>=2) marca('drogas', null, avisos);
  if (eS && (eM || menorCtx)) marca('menores', {hit:'emojis', oculto:true});
  if (eS>=2 || v.emojis.has('🔞')) marca('adulto', {hit:'emojis', oculto:true});
  if (v.emojis.has('🧀') && v.emojis.has('🍕') && (eS || eM || hay(v,['video','link','pack','intercambio','carpeta']))) marca('menores', {hit:'emojis', oculto:true});
  if (eA && (eV || venta)) marca('armas', {hit:'emojis', oculto:true});
  // patrones de acoso a menores (mensajes y comentarios) — se suman los mensajes recientes del mismo autor
  const previos = (ctx.previos||[]).map(vistas);
  const grupos = Object.entries(GROOM).filter(([g,l]) => hay(v,l) || previos.some(pv=>hay(pv,l))).map(([g])=>g);
  if (grupos.length){
    const conMenor = ctx.paraMenor;
    if (grupos.includes('fotos') && (conMenor || grupos.length>=2) || grupos.length>=3 || (conMenor && grupos.length>=2)) marca('grooming', {hit:grupos.join('+'), oculto:false});
    else avisos.push('riesgo');
  }
  // mensajes partidos: juntar los últimos del mismo autor
  if (previos.length){
    const junto = previos.map(p=>p.base).concat(v.base).join(''), juntoNum = previos.map(p=>p.numerica).concat(v.numerica).join('');
    if (!bloqueos.includes('enlace') && RE_LINK.test(junto.replace(/\s+/g,''))) marca('enlace', {hit:'enlace partido', oculto:true});
    if (!bloqueos.includes('teléfono') && RE_TEL_NUM.test(juntoNum.replace(/\D+/g,'')) && !RE_TEL_NUM.test(v.numerica)) marca('teléfono', {hit:'teléfono partido', oculto:true});
  }
  if (busca(v, RIESGO)) avisos.push('posible estafa');
  const nivel = Math.max(0, ...bloqueos.map(b=>NIVEL[b]||1));
  return {bloqueos, avisos, ok:!bloqueos.length, oculto, nivel, pistas};
}

function previosDe(para){ if(!para) return []; const c = chatCon(para); const ahora=Date.now(); return c ? c.msgs.filter(m=>m.de===S.yo && m.texto && ahora-m.t<10*60000).slice(-5).map(m=>m.texto) : []; }
function revisar(t, lugar, ctx={}){
  const yoU = !esNeg(S.yo) && usr(S.yo);
  if (yoU && yoU.suspendido) return {ok:false, bloqueos:['suspendida'], avisos:[], nivel:0, mensaje:'Tu cuenta está suspendida mientras el equipo de seguridad la revisa.'};
  if ((S.pausas[S.yo]||0) > Date.now()) { const m=Math.ceil((S.pausas[S.yo]-Date.now())/60000); return {ok:false, bloqueos:['pausa'], avisos:[], nivel:0, mensaje:`Por seguridad, no puedes publicar ni enviar mensajes durante ${m} min.`}; }
  const c = {...ctx}; if (c.para){ c.previos = previosDe(c.para); c.paraMenor = esMenor(c.para) && !esMenor(S.yo); }
  const r = analizarTexto(t, lugar, c);
  if (r.ok) return r;
  const intentos = (S.intentos[S.yo] = (S.intentos[S.yo]||[]).filter(x=>Date.now()-x.t<15*60000));
  intentos.push({t:Date.now(), oculto:r.oculto, nivel:r.nivel});
  const evasiones = intentos.filter(x=>x.oculto).length;
  let accion = '';
  if (r.nivel>=4){ if (yoU){ yoU.suspendido = true; } accion='Cuenta suspendida automáticamente'; r.mensaje = 'No se envió. Este contenido está prohibido. Tu cuenta quedó suspendida mientras el equipo de seguridad la revisa.'; }
  else if (r.nivel===3){ if (yoU){ yoU.strikes++; if (yoU.strikes>=S.cfg.strikesMax) { yoU.suspendido=true; accion='Cuenta suspendida (avisos)'; } else accion=`Aviso ${yoU.strikes}/${S.cfg.strikesMax}`; } }
  if (!accion && (evasiones>=2 || intentos.length>=4)){ S.pausas[S.yo] = Date.now() + (evasiones>=3?60:30)*60000; accion = `Pausa de ${evasiones>=3?60:30} min por intentos repetidos`; r.mensaje = 'Detectamos varios intentos de enviar contenido no permitido. Tus publicaciones y mensajes quedan en pausa un rato.'; }
  if (r.nivel>=2 || r.oculto || accion){
    S.alertas.unshift({id:'al'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), t:Date.now(), quien:S.yo, para:c.para||null, lugar:ctx.donde||lugar, texto:String(t).slice(0,280), cats:r.bloqueos, nivel:r.nivel, oculto:r.oculto, intentos:intentos.length, accion, estado:'nueva'});
    log('Escudo', `Bloqueó ${r.bloqueos.map(b=>ETIQ[b]||b).join(', ')}${r.oculto?' (intento de burlar)':''}`, `${perfilDe(S.yo).nombre}${accion?' · '+accion:''}`);
  }
  save();
  return r;
}

function listaFeed(){

  // "Para ti": primero lo reciente de quienes sigues, mezclado con lo demás
  const score = p => p.t + (sigue(S.yo,p.autor)?36*3600e3:0) + (p.tipo==='negocio'?6*3600e3:0);
  return l.sort((a,b)=>ui.feed==='parati'?score(b)-score(a):b.t-a.t);
}

/* ---------- visor de historias ---------- */
let stTimer=null, stElapsed=0; const ST_MS=5000;
function stActual(){ const st=ui.story; const uid=st.users[st.u]; const l=histDe(uid); return {uid, l, h:l[st.s]}; }
const mediaHist = h => verFoto(h.foto);
function alertaMsg(texto){
  const av = analizarTexto(texto,'privado').avisos; if (!av.length) return '';
  const partes = [];
  if (av.includes('riesgo')) partes.push('Si alguien te pide fotos, tu edad, tu número, que cambien de app o que guardes un secreto, no respondas. Bloquéalo y repórtalo. Cuéntaselo a un adulto de confianza.');
  if (av.includes('posible estafa')) partes.push('Nunca compartas códigos, contraseñas ni datos de tarjeta, aunque sea un amigo: su cuenta podría estar robada.');
  if (av.includes('teléfono')) partes.push('Este mensaje incluye un número de teléfono. Compártelo solo si de verdad conoces a esta persona.');
  if (av.includes('drogas')) partes.push('Este mensaje podría hablar de drogas. Si te ofrecen algo, repórtalo.');
  return partes.length ? `<div class="alerta">Cuidado: ${partes.join(' ')}</div>` : '';
}
function renderStory(){
  const box = $('#story'); if(!ui.story){ box.innerHTML=''; return; }
  const st = ui.story; const {uid,l,h} = stActual(); if(!h){ cerrarStory(); return; }
  S.vistas[S.yo+'|'+h.id]=true;
  const a = perfilDe(uid); const n = esNeg(uid)?neg(uid):null; const pr = h.prod?prod(h.prod):null;
  const prevs = st.users.slice(Math.max(0,st.u-2), st.u), nexts = st.users.slice(st.u+1, st.u+3);
  const prevCard = id => { const hh=histDe(id)[0]; const aa=perfilDe(id); return `<button class="stprev" data-a="stUser" data-x="${id}"><div class="media2">${mediaHist(hh)}</div><div class="c">${avatar(aa,52)}<span>${esc(aa.handle)}</span><span style="opacity:.75;font-weight:500">${hace(hh.t)}</span></div></button>`; };
  const puede = uid!==S.yo && amigos(S.yo,uid);
  box.innerHTML = `<div class="stv" role="dialog" aria-modal="true" aria-label="Historias de ${esc(a.nombre)}">
    <span class="brand2">${esc(S.cfg.marca)}</span><button class="x2" data-a="stClose" aria-label="Cerrar">×</button>
    ${prevs.map(prevCard).join('')}<button class="arr" data-a="stPrev" aria-label="Anterior">‹</button>
    <div class="stcard"><div class="media2">${mediaHist(h)}</div>
      <div class="top2"><div class="bars">${l.map((x,i)=>`<span class="${i<st.s?'done':''}"><i ${i===st.s?'id="stbar"':''}></i></span>`).join('')}</div>
        <div class="who2"><button style="padding:0;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:14px" data-a="stPerfil" data-x="${uid}">${avatar(a,32)}${handleV(a)}</button><small>${hace(h.t)}</small><span class="sp"></span>
          <button data-a="stPause" aria-label="${st.paused?'Reanudar':'Pausar'}">${st.paused?'▶':'❚❚'}</button>${uid!==S.yo?`<button data-a="reportarHist" data-x="${h.id}" aria-label="Reportar">⋯</button>`:''}</div></div>
      <button class="tap l" data-a="stPrev" aria-label="Anterior"></button><button class="tap r" data-a="stNext" aria-label="Siguiente"></button>
      ${n?`<button class="cta3" data-a="stPedir" data-x="${h.id}">${pr?'Pedir '+esc(pr.nombre)+' · '+money(pr.precio):'Ver la tienda'}</button>`:''}
      <div class="bot2">${uid===S.yo?`<span class="msg2">Tu historia · se borra en ${Math.max(1,Math.ceil((h.t+H24-Date.now())/3600e3))} h</span>`
        : puede?`<form data-form="respHist" novalidate style="flex:1;display:flex;min-width:0"><input id="st-resp" type="text" maxlength="200" placeholder="Responde a ${esc(a.handle)}…" aria-label="Responder" autocomplete="off"></form>`
        : `<span class="msg2">Síganse mutuamente para responder</span>`}
        ${uid!==S.yo?`<button class="ib ${S.likesHist[likeKey(h.id)]?'on':''}" data-a="likeHist" data-x="${h.id}" aria-label="Me gusta">${S.likesHist[likeKey(h.id)]?ico.heartF:ico.heart}</button>`:''}</div>
    </div><button class="arr" data-a="stNext" aria-label="Siguiente">›</button>${nexts.map(prevCard).join('')}
  </div>`;
  document.body.style.overflow='hidden';
}
function iniciarTimer(){ clearInterval(stTimer); stElapsed=0; stTimer=setInterval(()=>{ if(!ui.story||ui.story.paused) return; stElapsed+=50; const b=$('#stbar'); if(b) b.style.width=Math.min(100,stElapsed/ST_MS*100)+'%'; if(stElapsed>=ST_MS) stMover(1); },50); }
function stMover(d){
  const st=ui.story; if(!st) return; const {l}=stActual();
  if (d>0){ if(st.s<l.length-1) st.s++; else if(st.u<st.users.length-1){ st.u++; st.s=0; } else return cerrarStory(); }
  else { if(st.s>0) st.s--; else if(st.u>0){ st.u--; st.s=histDe(st.users[st.u]).length-1; } }
  stElapsed=0; renderStory();
}
function abrirStory(uid){

function varTxt(p){ return p.var.map(a=>`${a.n}: ${a.o.map(o=>o.n+(o.d?` ${o.d>0?'+':''}${o.d/100}`:'')).join(', ')}`).join('\n'); }
function modTxt(p){ return p.mods.map(g=>`${g.n} (${g.min}-${g.max}): ${g.o.map(o=>o.n+(o.d?` ${o.d>0?'+':''}${o.d/100}`:'')).join(', ')}`).join('\n'); }
function parseOpts(s){ return s.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{ const m=x.match(/^(.*?)\s*([+-])\s*\$?(\d+(?:\.\d+)?)$/); return m?{n:m[1].trim(),d:Math.round(parseFloat(m[3])*100)*(m[2]==='-'?-1:1)}:{n:x,d:0}; }); }
function parseVar(t){ return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const i=l.indexOf(':'); if(i<0) throw new Error(`Falta “:” en la línea “${l}”`); return {n:l.slice(0,i).trim(), o:parseOpts(l.slice(i+1))}; }); }
function parseMods(t){ return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(.*?)\s*(?:\((\d+)\s*-\s*(\d+)\))?\s*:\s*(.*)$/); if(!m) throw new Error(`Falta “:” en la línea “${l}”`); const o=parseOpts(m[4]); return {n:m[1].trim(), min:m[2]?+m[2]:0, max:m[3]?+m[3]:o.length, o}; }); }

    ${ui.err?`<div class="err" role="alert">${esc(ui.err)}</div>`:''}<div class="row"><button class="btn pri" type="submit">Guardar cambios</button></div></form>`;
}
function pVentas(n){

/* ============================================================
   REPARTO estilo "oferta y contraoferta" + APP DEL REPARTIDOR
   En el prototipo vive como un tercer modo ("Repartidor") para poder probar todo junto.
   En la versión real será una app aparte (iOS/Android) conectada al mismo servidor.
   Reglas:
   - El cliente ofrece un envío ≥ mínimo por distancia. Se suma una cuota de seguro (riesgos de trabajo).
   - La tienda acepta, pero NO prepara hasta que hay repartidor.
   - 10 min para que un repartidor acepte o el cliente acepte una contraoferta; si no, se cancela solo.
   - El repartidor ve solo la colonia hasta recoger; luego la dirección; al entregar se oculta. Nunca ve el perfil social.
   - Nadie marca "entregado" sin el código del cliente (repartidor, o la tienda si es "recoger" o envío propio).
   - Emergencia: el pedido vuelve a ofrecerse y el repartidor recibe una falta. 3 faltas = suspendido.
   ============================================================ */
const DIST_COL = {'Centro':1.5,'Jiquilpan':2.5,'Scally':3,'Las Fuentes':3.5,'Bienestar':4.5,'Primero de Mayo':4,'Otra (escribir en referencias)':5};
const kmDe = col => DIST_COL[col] ?? 3;   // distancia SIMULADA; en la versión real se calcula con el mapa
const RC = () => S.cfg.reparto;
const minimoEnvio = km => Math.round((RC().base + RC().porKm*km)/100)*100;
const seguroDe = envio => Math.round(envio * RC().seguroPct / 100);
const rep = id => S.repartidores.find(r=>r.id===id);
const yoRep = () => rep(S.yoRep);
const nombrePila = n => String(n||'').trim().split(/\s+/)[0] || 'Cliente';
const genCodigo = () => { const a=new Uint32Array(1); (crypto||window.crypto).getRandomValues(a); return String(a[0]%10000).padStart(4,'0'); };
const mmss = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const califRep = r => r.calif ? r.calif.toFixed(1) : 'Nuevo';
const REP_EST = {esperando_tienda:'Esperando a que la tienda acepte', buscando:'Buscando repartidor', asignado:'Repartidor va a la tienda', en_tienda:'Repartidor en la tienda', en_camino:'En camino a tu casa', llego:'Tu repartidor llegó', entregado:'Entregado', sin_repartidor:'Sin repartidor disponible'};

function seedRepartidores(){
  const R0 = (id,nombre,veh,placa,calif,entregas,extra={}) => ({id,nombre,vehiculo:veh,placa,calif,entregas,faltas:0,estado:'aprobado',ver:{ine:true,selfie:true,vehiculo:true},ganado:0,color:COLORES[+id.slice(1)%COLORES.length],...extra});
  return [
    R0('r1','Martín Leyva','Moto','VNX-12-34',4.9,312),
    R0('r2','Lupita Soto','Moto','VMK-88-21',4.8,540),
    R0('r3','Kevin Ochoa','Bici','—',4.7,95),
    R0('r4','Raúl Castro','Auto','VTR-445-B',4.6,210),
    R0('r5','Brenda Ruiz','Moto','VLM-02-77',5.0,61),
    R0('r6','Jesús Valenzuela','Moto','VNA-90-13',4.5,128,{faltas:1}),
    R0('r7','Iván Gil','Moto','VPP-31-58',null,0,{estado:'pendiente',ver:{ine:true,selfie:true,vehiculo:false}})
  ];
}
function asegurarReparto(){
  S.cfg.reparto = S.cfg.reparto || {base:2500, porKm:600, seguroPct:3, espera:10, noShowMin:15, ejemplo:true};
  if (!S.repartidores) S.repartidores = seedRepartidores();
  if (!S.yoRep) S.yoRep = 'r1';
  if (S.repOnline==null) S.repOnline = true;
  ['b1','b2','b5','b6','b7','b11','b13'].forEach(id=>{ const n=neg(id); if(n && n.repartoApp==null) n.repartoApp = true; });
}
asegurarReparto();

/* ---------- ciclo de vida ---------- */
function repEvento(p, s){ p.rep.pasos.push({s, t:Date.now()}); p.rep.estado = s; }
function iniciarBusqueda(p, motivo){
  p.rep.rep = null; p.rep.ofertas = []; p.rep.inicio = Date.now(); p.rep.expira = Date.now() + RC().espera*60000; p.rep.sim = 0; repEvento(p,'buscando');
  log('Reparto', motivo||'Pedido ofrecido a repartidores', `#${p.id} · oferta ${money(p.rep.oferta)}`);
}
function asignar(p, rid, monto){
  if (p.rep.estado!=='buscando') return false;
  const dif = monto - p.rep.oferta; p.rep.oferta = monto; p.envio = monto; p.rep.seguro = seguroDe(monto); p.total = p.subtotal + p.envio + p.rep.seguro;
  p.rep.rep = rid; p.rep.asignado = Date.now(); repEvento(p,'asignado');
  notif(p.cuenta,'sistema',null,{texto:`${nombrePila(rep(rid).nombre)} (${rep(rid).vehiculo}) llevará tu pedido #${p.id}.${dif>0?' Envío: '+money(monto)+'.':''}`});
  notif(p.neg,'sistema',null,{texto:`Pedido #${p.id}: ya hay repartidor. Puedes empezar a prepararlo.`});
  log('Reparto','Repartidor asignado',`#${p.id} → ${rep(rid).nombre} · ${money(monto)}`); return true;
}
function tickReparto(){
  const ahora = Date.now(); let cambio = false;
  for (const p of S.pedidos){
    if (p.modo!=='reparto' || !p.rep) continue;
    if (p.rep.estado==='buscando'){
      if (ahora > p.rep.expira){
        repEvento(p,'sin_repartidor'); p.estado='cancelado'; p.hist.push({s:'cancelado',t:ahora});
        notif(p.cuenta,'sistema',null,{texto:`No hubo repartidores disponibles para tu pedido #${p.id}. Se canceló y no se te cobra nada.`});
        notif(p.neg,'sistema',null,{texto:`Pedido #${p.id} cancelado: no hubo repartidores. No lo prepares.`});
        log('Reparto','Cancelado sin repartidor',`#${p.id}`); cambio = true; continue;
      }
      // simulación: otros repartidores de Los Mochis mandan contraofertas
      const otros = S.repartidores.filter(r=>r.estado==='aprobado' && r.id!==S.yoRep);
      const t = ahora - p.rep.inicio;
      if (otros.length && ((p.rep.sim===0 && t>12000) || (p.rep.sim===1 && t>35000))){
        const r = otros[(hashStr(p.id)+p.rep.sim*3) % otros.length];
        p.rep.ofertas.push({id:'o'+ahora.toString(36), rep:r.id, monto:p.rep.oferta + (p.rep.sim? 1000 : 500), t:ahora, sim:true}); p.rep.sim++; cambio = true;
      }
    }
    // repartidor simulado avanza solo
    const r = p.rep.rep && rep(p.rep.rep);
    if (r && p.rep.rep!==S.yoRep){
      const ult = p.rep.pasos.at(-1).t;
      if (p.rep.estado==='asignado' && ahora-ult>20000){ repEvento(p,'en_tienda'); cambio=true; }
      else if (p.rep.estado==='en_tienda' && p.estado==='listo' && ahora-ult>8000){ repEvento(p,'en_camino'); p.estado='en_camino'; p.hist.push({s:'en_camino',t:ahora}); notif(p.cuenta,'sistema',null,{texto:`Tu pedido #${p.id} va en camino.`}); cambio=true; }
      else if (p.rep.estado==='en_camino' && ahora-ult>90000){ repEvento(p,'llego'); notif(p.cuenta,'sistema',null,{texto:`Tu repartidor llegó. Dale tu código cuando tengas tu pedido en la mano.`}); cambio=true; }
    }
    // no se presentó (no llegó a la tienda a tiempo): se vuelve a ofrecer y recibe falta
    if (r && p.rep.estado==='asignado' && ahora - p.rep.asignado > RC().noShowMin*60000){ faltaRep(r, p, 'No llegó a la tienda a tiempo'); cambio = true; }
  }
  if (cambio) save();
  return cambio;
}
function faltaRep(r, p, motivo){
  r.faltas++; if (r.faltas>=3) r.estado='suspendido';
  p.rep.faltas = (p.rep.faltas||[]).concat({rep:r.id, motivo, t:Date.now()});
  notif(p.neg,'sistema',null,{texto:`Pedido #${p.id}: el repartidor no pudo continuar. Lo volvimos a ofrecer a otros repartidores.`});
  notif(p.cuenta,'sistema',null,{texto:`Tu pedido #${p.id} cambió de repartidor. Ya estamos buscando otro.`});
  iniciarBusqueda(p, `Re-ofrecido (${motivo})`);
  log('Reparto','Falta de repartidor',`${r.nombre}: ${motivo} · faltas ${r.faltas}/3${r.estado==='suspendido'?' · suspendido':''}`);
}
/* posición en el mapa (simulada): 0→1 de la base a la tienda y de la tienda a la casa */
function progresoMapa(p){
  const e = p.rep.estado, ult = p.rep.pasos.at(-1).t, ahora = Date.now();
  if (e==='asignado') return {tramo:0, f:Math.min(.95,(ahora-ult)/20000)};
  if (e==='en_tienda') return {tramo:0, f:1};
  if (e==='en_camino') return {tramo:1, f:Math.min(.97,(ahora-ult)/90000)};
  if (e==='llego'||e==='entregado') return {tramo:1, f:1};
  return null;
}
function mapaSVG(p, alto=210){
  const pr = progresoMapa(p); const A=[40,170], T=[150,70], C=[340,150];
  const pt = !pr ? null : pr.tramo===0 ? [A[0]+(T[0]-A[0])*pr.f, A[1]+(T[1]-A[1])*pr.f] : [T[0]+(C[0]-T[0])*pr.f, T[1]+(C[1]-T[1])*pr.f];
  return `<div class="mapa"><svg viewBox="0 0 380 220" style="height:${alto}px" role="img" aria-label="Mapa simulado del recorrido">
    <rect width="380" height="220" class="m-bg"/>
    <g class="m-calle">${[30,80,130,180].map(y=>`<line x1="0" y1="${y}" x2="380" y2="${y}"/>`).join('')}${[60,140,220,300].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="220"/>`).join('')}</g>
    <polyline class="m-ruta" points="${A.join(',')} ${T.join(',')} ${C.join(',')}"/>
    <g class="m-pin"><circle cx="${T[0]}" cy="${T[1]}" r="11" class="m-t"/><text x="${T[0]}" y="${T[1]+4}">🏪</text></g>
    <g class="m-pin"><circle cx="${C[0]}" cy="${C[1]}" r="11" class="m-c"/><text x="${C[0]}" y="${C[1]+4}">🏠</text></g>
    ${pt?`<g id="m-dot-${p.id}" data-pid="${p.id}" transform="translate(${pt[0]},${pt[1]})"><circle r="13" class="m-pulse"/><circle r="8" class="m-dot"/></g>`:''}
  </svg><span class="m-nota">Mapa simulado · en la versión real: mapa con calles y GPS en vivo</span></div>`;
}
function moverPuntos(){
  document.querySelectorAll('[id^="m-dot-"]').forEach(g=>{ const p=S.pedidos.find(x=>x.id===g.dataset.pid); if(!p) return; const pr=progresoMapa(p); if(!pr) return;
    const A=[40,170], T=[150,70], C=[340,150]; const pt = pr.tramo===0 ? [A[0]+(T[0]-A[0])*pr.f, A[1]+(T[1]-A[1])*pr.f] : [T[0]+(C[0]-T[0])*pr.f, T[1]+(C[1]-T[1])*pr.f];
    g.setAttribute('transform',`translate(${pt[0]},${pt[1]})`); });
  document.querySelectorAll('[data-exp]').forEach(el=>{ el.textContent = mmss(+el.dataset.exp - Date.now()); });
}

    ${R.estado!=='entregado'?`<div class="codebox"><span>Tu código de entrega</span><b class="num">${esc(p.codigo)}</b><small>Dáselo al repartidor <b>solo cuando tengas tu pedido en la mano</b>. Sin este código no puede marcarlo como entregado.</small></div>`:''}
    ${R.estado==='llego' && R.rep!==S.yoRep?`<button class="btn soft sm" data-a="simCodigo" data-x="${p.id}">Prototipo: simular que el repartidor escribe tu código</button>`:''}

}

function repInicio(r, activo){

function repPedido(r, p){
  if (!p) return `<div class="empty" style="padding:40px 10px"><h2>No tienes un pedido activo</h2><button class="btn pri" data-a="rTab" data-x="inicio">Ver pedidos disponibles</button></div>`;
  const n = neg(p.neg), e = p.rep.estado, recogido = ['en_camino','llego'].includes(e);
  const cobrar = p.pago==='efectivo' ? `<div class="line"><span>Paga en la tienda</span><b class="num">${money(p.subtotal)}</b></div><div class="line"><span>Cobra al cliente</span><b class="num">${money(p.total)}</b></div><div class="line small muted"><span>Tu ganancia (envío)</span><span class="num">${money(p.envio)}</span></div>` : '';
  const paso = {
    asignado:`<button class="btn pri block lg" data-a="repPaso" data-x="${p.id}" data-o="en_tienda">Llegué a la tienda</button>`,
    en_tienda: p.estado==='listo' ? `<button class="btn pri block lg" data-a="repPaso" data-x="${p.id}" data-o="en_camino">Recogí el pedido</button>` : `<div class="note">La tienda lo está preparando (${esc(ESTADOS[p.estado].l.toLowerCase())}). Te avisamos cuando esté listo.</div>`,
    en_camino:`<button class="btn pri block lg" data-a="repPaso" data-x="${p.id}" data-o="llego">Llegué con el cliente</button>`,
    llego:`<div class="card" style="gap:8px"><b>Pide el código al cliente</b><span class="small muted">Escríbelo cuando le entregues el pedido. Sin código no se puede marcar como entregado.</span>
      <div class="row nowrap"><input type="text" id="rcod" inputmode="numeric" maxlength="4" placeholder="0000" class="codein" autocomplete="off"><button class="btn pri" data-a="repEntregar" data-x="${p.id}">Entregar</button></div>
      ${p.rep.intentos?`<span class="small" style="color:var(--bad)">Código incorrecto (${p.rep.intentos}/3)</span>`:''}</div>`
  }[e];
  return `<div class="stack"><div class="row between"><h1 style="font-size:22px;margin:0">Pedido #${esc(p.id)}</h1><span class="pill">${esc(REP_EST[e])}</span></div>
    ${mapaSVG(p,180)}
    <div class="card" style="gap:6px"><div class="row nowrap">${avatar(perfilDe(n.id),34)}<div><b>${esc(n.nombre)}</b><div class="small muted">${n.direccion?esc(n.direccion):'Dirección de la tienda '+todoTag()}</div></div></div>
      <div class="rsep"></div>
      <div><b>${esc(nombrePila(p.cliente.nombre))}</b> <span class="small muted">· cliente</span></div>
      <div class="small">${recogido?`${esc(p.cliente.calle)}, Col. ${esc(p.cliente.colonia)}${p.cliente.ref?' · '+esc(p.cliente.ref):''}`:`Col. ${esc(p.cliente.colonia)} · <span class="muted">la dirección exacta aparece cuando recojas el pedido</span>`}</div>
      <div class="small muted">${p.items.map(it=>`${esc(String(it.qty))} × ${esc(it.nombre)}`).join(' · ')}</div>${cobrar}</div>
    ${paso}
    <div class="row between"><button class="lk" data-a="repEmergencia" data-x="${p.id}" style="color:var(--bad)">Tengo una emergencia</button>${e==='llego'?`<button class="lk" data-a="repNoPago" data-x="${p.id}">El cliente no quiere pagar</button>`:''}</div>
    <span class="small muted">No puedes cancelar un pedido aceptado. En una emergencia real se lo pasamos a otro repartidor y cuenta como falta (3 faltas = suspensión).</span></div>`;
}
function repGanancias(r){
  const ent = S.pedidos.filter(p=>p.rep && p.rep.rep===r.id && p.rep.estado==='entregado');

  return `<div class="stack"><h1>Ganancias</h1>
    <div class="rstats"><div><span>En el prototipo</span><b class="num">${money(tot)}</b></div><div><span>Entregas</span><b class="num">${ent.length}</b></div><div><span>Comisión de la app</span><b>$0</b></div></div>
    ${ent.length?`<div class="card" style="gap:0">${ent.map(p=>`<div class="line"><span>#${esc(p.id)} · ${esc(neg(p.neg).nombre)}<br><span class="small muted">${fecha(p.rep.pasos.at(-1).t)}</span></span><b class="num">${money(p.envio)}</b></div>`).join('')}</div>`:'<p class="muted">Aún no hay entregas en este prototipo.</p>'}

}

function registrarAccionesReparto(){ Object.assign(A, {

    asignar(p, S.yoRep, p.rep.oferta); save(); ui.rTab='pedido'; render(); toast('¡Pedido tuyo! Ve a la tienda.'); },
  repContra: (x,el) => { const p=S.pedidos.find(o=>o.id===x); if(!p||p.rep.estado!=='buscando') return toast('Ya no está disponible');
    const m = p.rep.oferta + (+el.dataset.o); p.rep.ofertas = p.rep.ofertas.filter(o=>o.rep!==S.yoRep); p.rep.ofertas.push({id:'o'+Date.now().toString(36), rep:S.yoRep, monto:m, t:Date.now()});
    notif(p.cuenta,'sistema',null,{texto:`Un repartidor pide ${money(m)} por llevar tu pedido #${p.id}. Revísalo en tu pedido.`}); save(); render(); toast('Contraoferta enviada al cliente'); },
  repOcultar: x => { const p=S.pedidos.find(o=>o.id===x); p.rep.ocultos=(p.rep.ocultos||[]).concat(S.yoRep); save(); render(); },
  repPaso: (x,el) => { const p=S.pedidos.find(o=>o.id===x), s=el.dataset.o; if(p.rep.rep!==S.yoRep) return;
    if (s==='en_camino'){ if(p.estado!=='listo') return toast('La tienda aún no lo marca como listo'); p.estado='en_camino'; p.hist.push({s:'en_camino',t:Date.now()}); notif(p.cuenta,'sistema',null,{texto:`Tu pedido #${p.id} va en camino.`}); }
    if (s==='llego') notif(p.cuenta,'sistema',null,{texto:'Tu repartidor llegó. Dale tu código cuando tengas tu pedido en la mano.'});
    repEvento(p,s); log('Reparto',REP_EST[s],`#${p.id} · ${yoRep().nombre}`); save(); render(); },
  repEntregar: x => { const p=S.pedidos.find(o=>o.id===x); const v=($('#rcod')?.value||'').replace(/\D/g,'');
    if ((p.rep.intentos||0)>=3) return toast('Demasiados intentos. Contacta a soporte desde Ayuda.');
    if (v!==p.codigo){ p.rep.intentos=(p.rep.intentos||0)+1; if(p.rep.intentos>=3){ S.alertas.unshift({id:'al'+Date.now().toString(36), t:Date.now(), quien:p.cuenta, para:null, lugar:'reparto', texto:`Pedido #${p.id}: 3 códigos de entrega incorrectos (repartidor ${yoRep().nombre}).`, cats:['reparto'], nivel:2, oculto:false, intentos:3, accion:'Entrega bloqueada hasta revisión', estado:'nueva'}); } save(); render(); return toast('Código incorrecto'); }
    entregarRep(p); const r=yoRep(); r.entregas++; r.ganado+=p.envio; save(); render(); toast(`Entregado. Ganaste ${money(p.envio)}`); },
  repEmergencia: x => { const p=S.pedidos.find(o=>o.id===x); if(!confirmarSimple('¿Seguro? Se lo pasaremos a otro repartidor y contará como falta.')) return; faltaRep(yoRep(), p, 'Emergencia del repartidor'); save(); ui.rTab='inicio'; render(); toast('Lo pasamos a otro repartidor. Cuídate.'); },
  repNoPago: x => { const p=S.pedidos.find(o=>o.id===x); const u=!esNeg(p.cuenta)&&usr(p.cuenta); if(u) u.suspendido=true;
    S.alertas.unshift({id:'al'+Date.now().toString(36), t:Date.now(), quien:p.cuenta, para:null, lugar:'reparto', texto:`Pedido #${p.id}: el repartidor ${yoRep().nombre} reporta que el cliente no quiso pagar el envío. Evidencia: GPS en el domicilio a las ${hora(Date.now())}.`, cats:['reparto'], nivel:3, oculto:false, intentos:1, accion:'Cliente suspendido mientras se revisa', estado:'nueva'});
    log('Reparto','Reporte: cliente no pagó',`#${p.id}`); save(); render(); toast('Reporte enviado. Revisaremos el caso y la cuenta del cliente queda suspendida mientras tanto.'); },
  subirOferta: (x,el) => { const p=S.pedidos.find(o=>o.id===x); if(p.rep.estado!=='buscando') return; p.rep.oferta += +el.dataset.o; p.envio=p.rep.oferta; p.rep.seguro=seguroDe(p.envio); p.total=p.subtotal+p.envio+p.rep.seguro; p.rep.ofertas=p.rep.ofertas.filter(o=>o.monto>p.rep.oferta); save(); render(); toast(`Ahora ofreces ${money(p.rep.oferta)}`); },
  aceptarOferta: (x,el) => { const p=S.pedidos.find(o=>o.id===x); const o=p.rep.ofertas.find(o=>o.id===el.dataset.o); if(!o||!asignar(p,o.rep,o.monto)) return toast('Ya no está disponible'); save(); render(); toast(`${nombrePila(rep(o.rep).nombre)} llevará tu pedido`); },
  simCodigo: x => { const p=S.pedidos.find(o=>o.id===x); entregarRep(p); const r=rep(p.rep.rep); r.entregas++; save(); render(); toast('Pedido entregado'); },
  repReportarCli: x => { const p=S.pedidos.find(o=>o.id===x); S.alertas.unshift({id:'al'+Date.now().toString(36), t:Date.now(), quien:S.yo, para:null, lugar:'reparto', texto:`Pedido #${p.id}: el cliente reporta un problema con el repartidor ${rep(p.rep.rep).nombre}.`, cats:['reparto'], nivel:2, oculto:false, intentos:0, accion:'', estado:'nueva'}); save(); toast('Reporte enviado al equipo de seguridad. Si estás en peligro, llama al 911.'); },
  cambiarRep: v => { S.yoRep=v; ui.rTab='inicio'; save(); render(); },
  repAprobar: x => { const r=rep(x); r.estado='aprobado'; r.ver={ine:true,selfie:true,vehiculo:true}; log('Admin','Repartidor aprobado',r.nombre); save(); rerender(); },
  repSuspender: x => { const r=rep(x); r.estado = r.estado==='suspendido'?'aprobado':'suspendido'; if(r.estado==='aprobado') r.faltas=0; log('Admin',r.estado==='suspendido'?'Repartidor suspendido':'Repartidor reactivado',r.nombre); save(); rerender(); },
  repCfg: () => { const g=id=>Math.round(+($('#'+id).value||0)*100); const c=RC(); c.base=g('rc-base'); c.porKm=g('rc-km'); c.seguroPct=+$('#rc-seg').value||0; c.espera=Math.max(1,+$('#rc-esp').value||10); c.ejemplo=false; log('Admin','Tarifas de reparto',`base ${money(c.base)} · km ${money(c.porKm)} · seguro ${c.seguroPct}%`); save(); rerender(); toast('Tarifas guardadas'); },
  codigoTienda: x => { const p=S.pedidos.find(o=>o.id===x); const v=($('#tcod-'+x)?.value||'').replace(/\D/g,''); if(v!==p.codigo){ p.intentosTienda=(p.intentosTienda||0)+1; save(); render(); return toast('Código incorrecto'); }
    p.estado='entregado'; p.hist.push({s:'entregado',t:Date.now()}); notif(p.cuenta,'sistema',null,{texto:`Pedido #${p.id} entregado. ¡Gracias!`}); log(neg(p.neg).nombre,'Entregado con código',`#${p.id}`); save(); render(); toast('Entregado'); }
}); }
function entregarRep(p){ repEvento(p,'entregado'); p.estado='entregado'; p.hist.push({s:'entregado',t:Date.now()}); notif(p.cuenta,'sistema',null,{texto:`Pedido #${p.id} entregado. ¡Buen provecho!`}); notif(p.neg,'sistema',null,{texto:`Pedido #${p.id} entregado al cliente.`}); log('Reparto','Entregado con código',`#${p.id} · ${rep(p.rep.rep).nombre}`); }
function confirmarSimple(msg){ try { return window.confirm(msg); } catch(e){ return true; } }

/* ---------- SEGURIDAD: alertas del Escudo ---------- */
const NIV_TXT = ['Baja','Baja','Media','Alta','Crítica'], NIV_CLS = ['','','warn','bad','bad'];
function aSeguridad(){
  const al = S.alertas, nuevas = al.filter(a=>a.estado==='nueva');
  const susp = S.usuarios.filter(u=>u.suspendido), pausa = Object.entries(S.pausas).filter(([k,v])=>v>Date.now());
  const ord = al.slice().sort((a,b)=>(a.estado==='nueva'?0:1)-(b.estado==='nueva'?0:1) || b.nivel-a.nivel || b.t-a.t);
  const cats = ['menores','explotacion','drogas','armas','violencia','adulto','ofensivo'];
  return `<div class="stack">
  <div class="kpis">
    <div class="kpi"><span>Alertas nuevas</span><b class="num">${nuevas.length}</b></div>
    <div class="kpi"><span>Críticas (menores)</span><b class="num">${al.filter(a=>a.nivel>=4).length}</b></div>
    <div class="kpi"><span>Intentos de burlar</span><b class="num">${al.filter(a=>a.oculto).length}</b></div>
    <div class="kpi"><span>Cuentas suspendidas</span><b class="num">${susp.length}</b></div>
    <div class="kpi"><span>En pausa ahora</span><b class="num">${pausa.length}</b></div>
  </div>
  <div class="note"><b>Cómo funciona el Escudo.</b> Revisa todo lo que se escribe (mensajes, comentarios, notas, publicaciones, nombres y biografías). Deshace trucos para esconder palabras (letras raras, l33t, letras separadas, emojis en clave, mensajes partidos) y busca patrones de acoso a menores. Si algo solo aparece después de "limpiar" el texto, lo cuenta como <b>intento de burlar</b>. Con 2 intentos así, la cuenta queda en pausa. Si el contenido pone en riesgo a menores, la cuenta se suspende sola y llega aquí como crítica. Al usuario nunca le decimos qué palabra lo delató.</div>
  <div class="note warn"><b>Si una alerta es crítica:</b> no borres la evidencia ni la reenvíes a nadie. Suspende la cuenta y denuncia ante la Policía Cibernética o la Fiscalía de tu estado. En la versión real, el sistema guarda la evidencia protegida automáticamente.</div>
  <h2 style="margin:6px 0 0">Alertas</h2>
  ${ord.length ? ord.map(a=>{ const q=perfilDe(a.quien), u=esNeg(a.quien)?null:usr(a.quien), p=a.para?perfilDe(a.para):null;
    return `<div class="card" style="padding:14px;${a.estado!=='nueva'?'opacity:.6':''}">
      <div class="row between" style="gap:8px"><div class="row nowrap">${avatar(q,36)}<div><b>${esc(q.nombre)}</b> <span class="small muted">@${esc(q.handle)}${u&&u.edad?' · '+u.edad+' años':''}</span><div class="small muted">${esc(a.lugar)}${p?' a <b>'+esc(p.nombre)+'</b>'+(esMenor(a.para)?' <span class="pill bad">menor de edad</span>':''):''} · ${hace(a.t)}</div></div></div>
      <div class="row" style="gap:6px"><span class="pill ${NIV_CLS[a.nivel]}">${NIV_TXT[a.nivel]}</span>${a.cats.map(c=>`<span class="pill">${esc(ETIQ[c]||c)}</span>`).join('')}${a.oculto?'<span class="pill warn">Intento de burlar</span>':''}${a.estado!=='nueva'?`<span class="pill ok">${a.estado}</span>`:''}</div></div>
      <div class="note" style="margin:10px 0;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word">${esc(a.texto)}</div>
      <div class="small muted">${a.accion?'Acción automática: <b>'+esc(a.accion)+'</b> · ':''}${a.intentos} intento(s) bloqueado(s) en 15 min</div>
      ${a.estado==='nueva'?`<div class="row" style="gap:8px;margin-top:10px">
        ${u?(u.suspendido?`<button class="btn sm" data-a="alQuitar" data-x="${u.id}">Quitar suspensión</button>`:`<button class="btn danger sm" data-a="alSusp" data-x="${u.id}">Suspender cuenta</button>`):''}
        ${a.nivel>=4?`<button class="btn danger sm" data-a="alDen" data-x="${a.id}">Marcar como denunciada</button>`:''}
        <button class="btn sm" data-a="alDesc" data-x="${a.id}">Descartar (falsa alarma)</button></div>`:''}
    </div>`; }).join('') : '<p class="muted">Sin alertas.</p>'}
  <h2 style="margin:10px 0 0">Prueba el filtro</h2>
  <div class="card" style="padding:14px"><p class="small muted" style="margin-top:0">Escribe aquí como si fueras alguien tratando de burlarlo. No se guarda ni sanciona a nadie.</p>
    <div class="row" style="gap:8px"><input type="text" id="esc-prueba" style="flex:1;min-width:180px" placeholder="Ej.: m 4 n d a m e  f 0 t o" value="${esc(ui.prueba?.t||'')}"><select id="esc-lugar" style="width:auto"><option value="privado">Mensaje a menor</option><option value="publico">Publicación</option></select><button class="btn pri" data-a="probarEscudo">Probar</button></div>
    ${ui.prueba?`<div class="note ${ui.prueba.r.ok?'':'bad'}" style="margin-top:10px">${ui.prueba.r.ok?'<b>Pasaría.</b>':'<b>Bloqueado:</b> '+ui.prueba.r.bloqueos.map(b=>esc(ETIQ[b]||b)).join(', ')+(ui.prueba.r.oculto?' · <b>intento de burlar</b>':'')}${ui.prueba.r.avisos.length?' · Avisos: '+ui.prueba.r.avisos.map(esc).join(', '):''}<div class="small muted" style="margin-top:4px">Texto limpio: ${esc(vistas(ui.prueba.t).pal)}</div></div>`:''}
  </div>
  <h2 style="margin:10px 0 0">Palabras y claves extra</h2>
  <div class="card" style="padding:14px"><p class="small muted" style="margin-top:0">Las claves cambian seguido. Agrega aquí las nuevas y el Escudo las detecta también escritas con trucos.</p>
    <div class="row" style="gap:8px"><input type="text" id="term-t" style="flex:1;min-width:160px" placeholder="Palabra o frase"><select id="term-c" style="width:auto">${cats.map(c=>`<option value="${c}">${esc(ETIQ[c])}</option>`).join('')}</select><button class="btn" data-a="termAdd">Agregar</button></div>
    <div class="row" style="gap:6px;margin-top:10px">${S.cfg.terminos.map((x,i)=>`<span class="pill">${esc(x.t)} · ${esc(ETIQ[x.cat])} <button class="lk" data-a="termDel" data-x="${i}" aria-label="Quitar">×</button></span>`).join('') || '<span class="small muted">Sin palabras extra.</span>'}</div>
  </div>
  <div class="note"><b>Capa de IA (versión real, en el servidor).</b> Además de estas reglas, cada texto y foto se manda a modelos de moderación que entienden contexto. Las fotos subidas se comparan contra bases de imágenes de abuso infantil ya conocidas. Las conversaciones con riesgo de acoso a menores se marcan con un puntaje. Esto no se puede hacer dentro del navegador: necesita el servidor (fase 2).</div>
  </div>`;
}

function renderLayer(){
  let h = '';
  if (ui.mode==='app'){
    if (ui.pend) h = avisoOtroComercio();
    else if (ui.sel) h = hojaProducto();
    else if (ui.sheet) h = ({coment:hojaComentarios, compartir:hojaCompartir, opcPost:hojaOpcPost, reportar:hojaReportar, opcPerfil:hojaOpcPerfil, publicar:hojaPublicar, nota:hojaNota, crear:hojaCrear, historia:hojaHistoria, cuentas:hojaCuentas, mas:hojaMas}[ui.sheet.t]||(()=>''))();
  }
  $('#layer').innerHTML = h;
  if (!ui.story) document.body.style.overflow = h ? 'hidden' : '';

function go(view, keep){

function agregar(sel){
  const p = prod(sel.pid);
  const det = [...p.var.map((a,i)=>sel.v[i]), ...p.mods.flatMap((g,i)=>sel.m[i]||[])].filter(Boolean).join(', ');
  if (!S.carrito) S.carrito = {neg:p.neg, items:[], origen:null};
  if (ui.origen && post(ui.origen)?.autor===p.neg) S.carrito.origen = ui.origen;
  S.carrito.items.push({pid:p.id, sel:{v:[...sel.v], m:sel.m.map(a=>[...a])}, qty:sel.qty, det, nota:sel.note||''});
  ui.sel=null; ui.origen=null; save(); render(); toast(`${p.nombre} agregado al carrito`);
}
function guardarBorrador(){ const t=$('#pub-txt'); if(t) ui.draftTxt=t.value; }
function redimensionar(file, max, cuadrado){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let sx=0,sy=0,sw=img.width,sh=img.height;
  if (cuadrado){ const k=Math.min(sw,sh); sx=(sw-k)/2; sy=(sh-k)/2; sw=sh=k; c.width=c.height=max; } else { const e=Math.min(1,max/Math.max(sw,sh)); c.width=Math.round(sw*e); c.height=Math.round(sh*e); }
  c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; img.onerror=()=>rej(new Error('img')); img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
// Al redibujar la foto en un canvas se eliminan los metadatos (EXIF), incluida la ubicación GPS.
async function leerFotos(input, limite){ const files=[...(input.files||[])].filter(f=>f.type.startsWith('image/')).slice(0,limite); const out=[]; for (const f of files){ if (f.size>25*1024*1024) continue; out.push({m:await redimensionar(f,1080,false)}); } return out; }
async function guardarFoto(d){ if(!d.m) return d; const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); if(!IDB.db) await IDB.open(); await IDB.put(id,d.m); MEDIA[id]=d.m; return {m:id}; }

/* ---------- eventos ---------- */
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if(!el) return; const fn = A[el.dataset.a]; if(fn) fn(el.dataset.x, el, e); });
document.addEventListener('dblclick', e => { const c = e.target.closest('[data-dbl]'); if(!c) return; const id=c.dataset.dbl; if(!leGusta(id)) A.like(id); else { const bh=$('#bh-'+id); if(bh){ bh.classList.remove('go'); void bh.offsetWidth; bh.classList.add('go'); } } });

document.addEventListener('focusin', e => { if(e.target.id==='st-resp' && ui.story) ui.story.paused=true; });
document.addEventListener('input', e => {

  if (e.target.id==='sheet-note' && ui.sel) ui.sel.note=e.target.value;
  if (e.target.id==='pub-txt') ui.draftTxt=e.target.value;
  if (e.target.id==='f-oferta') actualizarTotales();
});
document.addEventListener('change', async e => {
  const t=e.target;
  if (t.id==='solo-disp'){ ui.soloDisp=t.checked; rerender(); }
  if (t.dataset && t.dataset.ch && A[t.dataset.ch]) A[t.dataset.ch](t.value);
  if (t.name==='modo' || t.id==='f-col' || t.id==='f-oferta') actualizarTotales();
  if (t.id==='pub-files'){ guardarBorrador(); try { const nuevas = await leerFotos(t, 10-ui.draft.length); ui.draft.push(...nuevas.slice(0,10-ui.draft.length)); ui.err=''; } catch(err){ ui.err='No se pudo leer una de las fotos.'; } renderLayer(); }
  if (t.id==='hist-file' && t.files[0]){ try { ui.draftH={m:await redimensionar(t.files[0],1080,false)}; ui.err=''; } catch(err){ ui.err='No se pudo leer la foto.'; } renderLayer(); }
});
document.addEventListener('scroll', e => {
  const tr = e.target; if (!(tr instanceof Element) || !tr.dataset || !tr.dataset.car) return;
  const i = Math.round(tr.scrollLeft / tr.clientWidth); const id = tr.dataset.car;
  const n = $('#cn-'+id); if (n) n.textContent = `${i+1}/${tr.children.length}`;
  document.querySelectorAll('#cd-'+id+' i').forEach((d,k)=>d.classList.toggle('on',k===i));
}, true);
document.addEventListener('keydown', e => {
  if (ui.story && e.target.id!=='st-resp'){ if(e.key==='Escape') return cerrarStory(); if(e.key==='ArrowRight') return stMover(1); if(e.key==='ArrowLeft') return stMover(-1); }
  if (e.key==='Escape' && (ui.sel||ui.pend||ui.sheet)){ ui.sel=null; ui.pend=null; ui.sheet=null; renderLayer(); }
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(PREF.tema==='sistema') rerender(); }); } catch(e){}
