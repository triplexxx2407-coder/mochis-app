/* ---------- clima real de Los Mochis (Open-Meteo, sin llave) ---------- */
const CLIMA_URL = 'https://api.open-meteo.com/v1/forecast?latitude=25.79&longitude=-108.99&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=America%2FMazatlan&forecast_days=7';
const WMO = c => c===0?['☀️','Despejado']:c<=2?['🌤️','Poco nublado']:c===3?['☁️','Nublado']:c<=48?['🌫️','Niebla']:c<=57?['🌦️','Llovizna']:c<=67?['🌧️','Lluvia']:c<=77?['🌨️','Nieve']:c<=82?['🌧️','Chubascos']:c<=86?['🌨️','Nevadas']:['⛈️','Tormenta'];
let CLIMA = null, climaEstado = 'cargando';
async function cargarClima(forzar){
  try { const c = JSON.parse(localStorage.getItem('lm-clima')||'null'); if (!forzar && c && Date.now()-c.t < 30*60000){ CLIMA=c.d; climaEstado='ok'; return; } } catch(e){}
  try { const r = await fetch(CLIMA_URL); if(!r.ok) throw new Error(r.status); CLIMA = await r.json(); climaEstado='ok'; try{ localStorage.setItem('lm-clima', JSON.stringify({t:Date.now(), d:CLIMA})); }catch(e){} }
  catch(e){ climaEstado='error'; }
  const b = $('#clima-btn'); if (b) b.outerHTML = climaBtn(); if (ui.sheet?.t==='clima') renderLayer();
}
function climaBtn(){
  if (climaEstado==='ok' && CLIMA?.current){ const c=CLIMA.current, [ic,tx]=WMO(c.weather_code); return `<button id="clima-btn" class="clima" data-a="clima" title="${tx} en Los Mochis">${ic}<b>${Math.round(c.temperature_2m)}°</b><small>Los Mochis</small></button>`; }
  return `<button id="clima-btn" class="clima" data-a="clima" title="Clima de Los Mochis">${climaEstado==='error'?'🌡️':'⏳'}<b>--°</b><small>Clima</small></button>`;
}
function hojaClima(){
  if (climaEstado!=='ok' || !CLIMA) return hoja('Clima en Los Mochis', `<p class="muted">${climaEstado==='error'?'No se pudo cargar el clima. En la vista previa de Claude se bloquean las conexiones externas; en tu página de GitHub sí funciona.':'Cargando…'}</p><button class="btn" data-a="climaRetry">Reintentar</button>`);
  const c = CLIMA.current, [ic,tx] = WMO(c.weather_code); const H = CLIMA.hourly, D = CLIMA.daily;
  const ahora = c.time.slice(0,13); let i0 = H.time.findIndex(t=>t.slice(0,13)===ahora); if (i0<0) i0=0;
  const horas = H.time.slice(i0, i0+24).map((t,k)=>({h:t.slice(11,16), t:H.temperature_2m[i0+k], w:H.weather_code[i0+k], p:H.precipitation_probability[i0+k]}));
  const dia = s => { const d = new Date(s+'T12:00:00'); return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()]+' '+d.getDate(); };
  const mn = Math.min(...D.temperature_2m_min), mx = Math.max(...D.temperature_2m_max);
  return hoja('Clima en Los Mochis', `<div class="clhead"><span class="big">${ic}</span><div><b class="num">${Math.round(c.temperature_2m)}°C</b><span>${tx} · se siente ${Math.round(c.apparent_temperature)}°</span><small>Humedad ${c.relative_humidity_2m}% · viento ${Math.round(c.wind_speed_10m)} km/h</small></div></div>
    <b>Próximas 24 horas</b><div class="clhoras">${horas.map(h=>`<div><small>${h.h}</small><span>${WMO(h.w)[0]}</span><b class="num">${Math.round(h.t)}°</b>${h.p?`<small class="lluv">${h.p}%</small>`:'<small>&nbsp;</small>'}</div>`).join('')}</div>
    <b>Esta semana</b><div class="cldias">${D.time.map((t,k)=>{ const lo=D.temperature_2m_min[k], hi=D.temperature_2m_max[k]; return `<div class="cld"><span class="d">${k===0?'Hoy':dia(t)}</span><span>${WMO(D.weather_code[k])[0]}</span><small class="lluv">${D.precipitation_probability_max[k]?D.precipitation_probability_max[k]+'%':''}</small><span class="num lo">${Math.round(lo)}°</span><span class="rng"><i style="left:${(lo-mn)/(mx-mn||1)*100}%;right:${100-(hi-mn)/(mx-mn||1)*100}%"></i></span><span class="num">${Math.round(hi)}°</span></div>`; }).join('')}</div>
    <span class="small muted">Datos en vivo de Open-Meteo · hora de Sinaloa · actualizado ${c.time.slice(11,16)}</span>`);
}

/* ---------- tarjetas teñidas con el color de su foto ---------- */
function colorDominante(img){
  try { const c = document.createElement('canvas'); c.width = c.height = 24; const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(img,0,0,24,24);
    const d = x.getImageData(0,0,24,24).data; let r=0,g=0,b=0,w=0;
    for (let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2]; const mx=Math.max(R,G,B), mn=Math.min(R,G,B); const sat = mx? (mx-mn)/mx : 0; const lum=(mx+mn)/2;
      const peso = (sat*sat + .02) * (lum>235||lum<20 ? .15 : 1); r+=R*peso; g+=G*peso; b+=B*peso; w+=peso; }
    if (!w) return null; r/=w; g/=w; b/=w;
    // aviva el color: más saturación para que se note el tono de la foto
    const m=(r+g+b)/3, k=1.6; return [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(m+(v-m)*k))));
  } catch(e){ return null; }
}

  const col = colorDominante(im); if (col) card.style.setProperty('--tint', `rgb(${col.join(',')})`); }, true);

/* ---------- sanciones justas: avisos que caducan, pausas temporales y apelación ---------- */
function revisarSanciones(u){
  if (!u || u.negocio) return u;
  if (!u.strikeLog) u.strikeLog = Array.from({length:u.strikes||0}, ()=>({t:Date.now()-10*DIA, motivo:'otro'}));
  u.strikeLog = u.strikeLog.filter(s=>Date.now()-s.t < 90*DIA && !s.anulado);
  u.strikes = u.strikeLog.length;
  if (u.subidas===false && u.bloqHasta && Date.now()>u.bloqHasta){ u.subidas = true; u.bloqHasta = null; }
  if (u.suspendido && u.suspHasta && Date.now()>u.suspHasta){ u.suspendido = false; u.suspHasta = null; u.susp = null; }
  return u;
}
function registrarAviso(u, motivo, ref){
  revisarSanciones(u); u.strikeLog.push({t:Date.now(), motivo, ref:ref||null}); u.strikes = u.strikeLog.length; return u.strikes;
}
function strike(autor, motivo, ref){
  if (esNeg(autor) || !['publicidad','adulto','enlace','estafa','menores','drogas','armas','explotacion','ofensivo'].includes(motivo)) return '';
  const u = usr(autor); const n = registrarAviso(u, motivo, ref); const max = S.cfg.strikesMax;
  if (n >= max){ const dias = n===max ? 1 : n===max+1 ? 7 : 30; u.subidas = false; u.bloqHasta = Date.now()+dias*DIA;
    notif(u.id,'sistema',null,{texto:`Tus publicaciones quedan en pausa ${dias===1?'24 horas':dias+' días'} por acumular ${n} avisos. Si crees que es un error, apela en Configuración → Estado de tu cuenta.`});
    return ` · ${n} avisos · pausa de ${dias===1?'24 h':dias+' días'}`; }
  return ` · aviso ${n}/${max}`;
}
function quitarAviso(u, ref){ revisarSanciones(u); const i = ref ? u.strikeLog.findIndex(s=>s.ref===ref) : u.strikeLog.length-1; if (i>=0) u.strikeLog.splice(i,1); u.strikes = u.strikeLog.length; if (u.strikes < S.cfg.strikesMax){ u.subidas = true; u.bloqHasta = null; } }
const fechaCorta = t => new Date(t).toLocaleDateString('es-MX',{day:'numeric', month:'short'});
const horaFecha = t => new Date(t).toLocaleString('es-MX',{day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
function estadoCuenta(u){
  revisarSanciones(u);
  if (u.suspendido) return {c:'bad', t:u.suspHasta?`Suspendida hasta el ${horaFecha(u.suspHasta)}`:'Suspendida: una persona del equipo la está revisando', d:u.suspHasta?'Por varios avisos seguidos. Se reactiva sola.':'Por contenido grave. Ninguna cuenta se elimina sin que una persona la revise.'};
  if (u.subidas===false) return {c:'warn', t:u.bloqHasta?`Publicaciones en pausa hasta el ${horaFecha(u.bloqHasta)}`:'Publicaciones en pausa', d:'Puedes seguir usando la app, ver, comprar y escribir a tus amigos.'};
  if (u.strikes) return {c:'warn', t:`${u.strikes} aviso${u.strikes>1?'s':''} activo${u.strikes>1?'s':''}`, d:`Con ${S.cfg.strikesMax} avisos tus publicaciones se pausan 24 horas. Los avisos se borran solos a los 90 días.`};
  return {c:'ok', t:'Todo en orden', d:'No tienes avisos. ¡Gracias por cuidar la comunidad!'};
}

  else { const p = post(ref); titulo='Apelar una publicación rechazada'; det = p ? `"${(p.texto||'Sin texto').slice(0,80)}" · ${MOTIVOS[p.motivo]||''}` : ''; }

function senalesVerif(v){
  const u = usr(v.cuenta); const s = [];
  if (CORREO_GRATIS.test(v.correo)) s.push(['bad', v.tipo==='gobierno'?'Correo gratuito: el gobierno usa dominio oficial':'Correo gratuito, no institucional']);
  if (normNombre(v.nombre).replace(/[^a-z]/g,'') !== normNombre(u.nombre).replace(/[^a-z]/g,'')) s.push(['warn','El nombre oficial no coincide con el del perfil']);
  const parecida = S.usuarios.find(x=>x.verif && x.id!==u.id && (normNombre(x.nombre).includes(normNombre(v.nombre).replace(/oficial/g,'').trim().split(' ')[0]) || normNombre(v.nombre).includes(normNombre(x.nombre).split(' ')[0])) );
  if (parecida) s.push(['bad',`Nombre parecido a una cuenta ya verificada: @${parecida.usuario}`]);
  const p = protegido(v.nombre); if (p) s.push(['warn',`Usa un nombre protegido (${p}): confirma que es la institución real`]);
  if (u.nueva) s.push(['bad','Cuenta creada hace muy poco']);
  if (u.strikes) s.push(['bad',`La cuenta tiene ${u.strikes} aviso(s)`]);
  if (seguidores(u.id) < 15 && v.tipo!=='gobierno') s.push(['warn',`Pocos seguidores (${seguidores(u.id)})`]);
  if (!v.docs.ine || !v.docs.selfie) s.push(['bad','Faltan INE o selfie']);
  if (VERIF[v.tipo].req.includes('notoriedad') && (v.menciones||'').split('\n').filter(x=>x.trim()).length<3) s.push(['warn','Menos de 3 menciones en medios']);
  return s;
}

        <div class="vgrid"><span>Nombre oficial</span><b>${esc(v.nombre)}</b><span>Responsable</span><b>${esc(v.resp)} · ${esc(v.cargo)}</b><span>Correo</span><b>${esc(v.correo)}</b><span>Sitio o red oficial</span><b>${esc(v.sitio||'—')}</b>${v.menciones?`<span>Menciones</span><b style="white-space:pre-line">${esc(v.menciones)}</b>`:''}<span>Código</span><b class="num">${esc(v.codigo)}</b><span>Documentos</span><b>INE ${v.docs.ine?'✓':'✗'} · Selfie ${v.docs.selfie?'✓':'✗'}${req.includes('documento')?` · Documento ${v.docs.doc?'✓':'✗'}`:''}</b></div>

async function rComprimir(file, max=1280){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const k = Math.min(1, max/Math.max(img.width, img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));
  } finally { URL.revokeObjectURL(url); }
}

function registrarAccionesReal(){
  Object.assign(A, {
    rRecargar: () => location.reload(),
    rLTab: x => { RV.ltab=x; RV.err=''; renderReal(); },
    rSalir: async () => { if (typeof vSalirVivo==='function') vSalirVivo(); await RV.sb.auth.signOut(); RV.user=null; RV.me=null; RV.fase='login'; ui.mode='real'; renderReal(); }
  });
  Object.assign(F, {
    rPassLogin: async () => { const crear = RV.ltab==='crear'; const mail = ($('#rl-mail').value||'').trim().toLowerCase(), pw = $('#rl-pass').value||''; RV.mail = mail; RV.err='';
      const fail = m => { RV.err=m; renderReal(); };
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(mail)) return fail('Escribe un correo válido.');
      if (pw.length<8) return fail('La contraseña debe tener al menos 8 caracteres.');
      if (crear && pw !== $('#rl-pass2').value) return fail('Las contraseñas no coinciden.');
      const btn = $('[data-form="rPassLogin"] button[type=submit]'); if (btn){ btn.disabled=true; btn.textContent='Un momento…'; }
      const r = crear ? await RV.sb.auth.signUp({email:mail, password:pw, options:{emailRedirectTo: location.origin + location.pathname}}) : await RV.sb.auth.signInWithPassword({email:mail, password:pw});
      if (r.error){ const m = r.error.message||'';
        if (/invalid login/i.test(m)) return fail('Correo o contraseña incorrectos. Si tu cuenta la creaste con enlace, usa "¿Olvidaste tu contraseña?".');
        if (/already registered|already exists/i.test(m)) { RV.ltab='entrar'; return fail('Ese correo ya tiene cuenta. Entra con tu contraseña.'); }
        if (/not confirmed/i.test(m)) return fail('Tu correo aún no está confirmado. Revisa tu bandeja.');
        if (/rate|seconds|security purposes/i.test(m)) return fail('Demasiados intentos. Espera un momento y vuelve a intentar.');
        if (/weak|pwned|leaked/i.test(m)) return fail('Esa contraseña es muy fácil de adivinar. Usa otra más larga.');
        return fail(rErr(r.error)); }
      if (crear && !r.data.session){ RV.ltab='entrar'; return fail('Cuenta creada. Revisa tu correo para confirmarla y luego entra.'); }
    },
    rPass: async () => { const pw=$('#rp-pass').value||''; RV.errp='';
      if (pw.length<8){ RV.errp='Mínimo 8 caracteres.'; return renderReal(); }
      if (pw!==$('#rp-pass2').value){ RV.errp='Las contraseñas no coinciden.'; return renderReal(); }
      const {error} = await RV.sb.auth.updateUser({password:pw}); if (error){ RV.errp = /weak|pwned|leaked/i.test(error.message)?'Esa contraseña es muy fácil de adivinar.':rErr(error); return renderReal(); }
      RV.errp=''; $('#rp-pass').value=''; $('#rp-pass2').value=''; toast('Contraseña guardada'); },
    rLogin: async () => { const mail = ($('#rl-mail').value||'').trim().toLowerCase(); RV.mail = mail; RV.err='';
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(mail)){ RV.err='Escribe un correo válido.'; return renderReal(); }
      const {error} = await RV.sb.auth.signInWithOtp({email:mail, options:{emailRedirectTo: location.origin + location.pathname, shouldCreateUser:true}});
      if (error){ RV.err = /rate|seconds|security purposes/i.test(error.message) ? 'Espera un momento antes de pedir otro enlace (hay un límite de correos por hora).' : rErr(error); return renderReal(); }
      RV.enviado = Date.now(); renderReal(); },
    rRegistro: async () => { const nom=$('#rr-nom').value.trim(), usr=$('#rr-usr').value.trim().toLowerCase().replace(/^@/,''), nac=$('#rr-nac').value; RV.err='';
      const fail = m => { RV.err=m; renderReal(); };
      if (nom.length<2) return fail('Escribe tu nombre.'); if (!/^[a-z0-9._]{3,24}$/.test(usr)) return fail('El usuario debe tener de 3 a 24 letras minúsculas, números, punto o guion bajo.');
      if (!nac) return fail('Escribe tu fecha de nacimiento.'); if (!$('#rr-ok').checked) return fail('Acepta el aviso de privacidad, los términos y las reglas para continuar.');
      const edad = (Date.now() - new Date(nac+'T12:00:00').getTime()) / (365.25*864e5); const tutor = $('#rr-tutor').checked;
      if (edad < 18 && !tutor) return fail('Como eres menor de 18 años, necesitas el permiso de tu mamá, papá o tutor. Pídeles que lean el Aviso de privacidad y marca la casilla.');
      const e = rTextoOk(nom,'publico'); if (e) return fail(e);
      const pr = await RV.sb.from('privado').insert({id:RV.user.id, nacimiento:nac}); if (pr.error && !/duplicate/i.test(pr.error.message)) return fail(rErr(pr.error));
      await RV.sb.rpc('aceptar_legal', {p_version:LEGAL_VERSION, p_tutor:edad < 18 && tutor});
      const colores = ['#7C3AED','#0369A1','#B45309','#DB2777','#15803D','#C2410C','#0E7490','#4338CA','#BE123C'];
      const {error} = await RV.sb.from('profiles').insert({id:RV.user.id, usuario:usr, nombre:nom, color:colores[Math.floor(Math.random()*colores.length)]}); if (error) return fail(rErr(error));
      RV.me=null; const {data} = await RV.sb.auth.getSession(); await rSesion(data.session); toast('¡Bienvenido! Busca a tus amigos para seguirlos'); }
  });
}

  const abrirLP = el => { const [t, id] = el.dataset.lp.split(':'); lpHecho = true; setTimeout(()=>{ lpHecho = false; }, 700); if (navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}

  ['pointerup','pointercancel','scroll'].forEach(ev=>document.addEventListener(ev, ()=>clearTimeout(lpT), true));
  document.addEventListener('pointermove', e => { if (Math.abs(e.clientX-lpX)>8 || Math.abs(e.clientY-lpY)>8) clearTimeout(lpT); });
  document.addEventListener('contextmenu', e => { const el = e.target.closest('[data-lp]'); if (!el) return; e.preventDefault(); clearTimeout(lpT); abrirLP(el); });
  document.addEventListener('click', e => { if (lpHecho && e.target.closest('[data-lp]')){ e.stopPropagation(); e.preventDefault(); lpHecho = false; } }, true);
}

/* ============================================================
   v18 — likes a notas (privados) y a comentarios (con contador),
   "Mis likes", botón "Mi negocio" fijo, inicio con lo más reciente
   y "Personas que quizás conoces".
   ============================================================ */
function asegurarV18(){
  if (!S) return;
  S.likesNota = S.likesNota || {};   // 'cuenta|t' → true (los que yo di)
  S.notaLikers = S.notaLikers || {}; // 'cuenta|t' → [ids] (quién le dio like a MIS notas)
  S.likesCom = S.likesCom || {};     // id comentario → true (los que yo di)
  S.nLikesCom = S.nLikesCom || {};   // id comentario → número total
}
const notaKey = n => n ? n.autor + '|' + (n.ts || n.t) : '';
const comKey = c => c ? (c.sid ? 'k'+c.sid : c.id) : '';
const tieneNegocio = () => !!(S && S.misNegocios && S.misNegocios.length);

/* ---------- notas ---------- */
function likersNotaHTML(n){
  asegurarV18(); const l = (S.notaLikers[notaKey(n)]||[]).filter(id=>!bloq(id));
  if (!l.length) return `<p class="small muted" style="margin:0">Cuando a tus amigos les guste tu nota, aquí lo verás. Solo tú lo ves.</p>`;
  return `<div class="nlikers"><b class="small">${ico.heartF} Les gustó tu nota</b><span class="small muted">Solo tú lo ves</span>
    ${l.map(id=>{ const a=perfilDe(id); return `<button class="srow" style="background:none;border:0;padding:4px 0;text-align:left;color:var(--fg)" data-a="verPerfil" data-x="${id}">${avatar(a,32)}<div class="tx"><b>${esc(a.handle)}</b></div></button>`; }).join('')}</div>`;
}
function hojaNotaV18(){
  const h = hojaNota(); const n = notaDe(S.yo); if (!n) return h;
  const i = h.lastIndexOf('</form>'); if (i<0) return h;
  return h.slice(0,i) + likersNotaHTML(n) + h.slice(i);
}
function hojaVerNotaV18(){
  const id = ui.sheet.id, n = notaDe(id); let h = hojaVerNota(); if (!n) return h;
  asegurarV18();
  const puede = id!==S.yo && !soyNegocio() && !esNeg(id) && amigos(S.yo, id);
  if (!puede) return h;
  const on = !!S.likesNota[notaKey(n)];
  const btn = `<button type="button" class="btn ${on?'pri':'soft'} nlike" data-a="likeNota" data-x="${id}" aria-pressed="${on}">${on?ico.heartF:ico.heart} ${on?'Te gusta':'Me gusta'}</button><span class="small muted nlike-h">Solo tú y @${esc(perfilDe(id).handle)} ven este me gusta.</span>`;
  return h.replace(/(<div class="small muted">@[^<]*<\/div><\/div>)/, `$1<div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">${btn}</div>`);
}

  const pen = new Set(ui.penal||[]); const H = 3600e3;
  if (VIVO){ // en vivo: lo más nuevo arriba, de todos (sigas o no), con una mezcla ligera

const ESC_FOTO = {modelo:null, ocr:null, cargando:null};
const EF_NSFW = 'https://cdn.jsdelivr.net/npm/nsfwjs@4.4.0/dist/';
const EF_TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/';
function efScript(src){ return new Promise((ok, mal) => {
  if (document.querySelector(`script[data-ef="${src}"]`)) return ok();
  const s = document.createElement('script'); s.src = src; s.async = true; s.dataset.ef = src; s.onload = ok; s.onerror = () => { s.remove(); mal(new Error('red')); }; document.head.appendChild(s); }); }
function prepararEscudoFoto(){
  if (ESC_FOTO.modelo && ESC_FOTO.ocr) return Promise.resolve();
  if (ESC_FOTO.cargando) return ESC_FOTO.cargando;
  ESC_FOTO.cargando = (async () => {
    if (!ESC_FOTO.modelo){
      await efScript(EF_NSFW + 'browser/nsfwjs.min.js');

      await efScript(EF_NSFW + 'models/mobilenet_v2/group1-shard1of1.min.js');
      ESC_FOTO.modelo = await nsfwjs.load('MobileNetV2');
    }
    if (!ESC_FOTO.ocr){
      await efScript(EF_TESS + 'tesseract.min.js');
      ESC_FOTO.ocr = await Tesseract.createWorker('spa', 1, {workerPath: EF_TESS + 'worker.min.js', corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
        langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa@1.0.0/4.0.0_best_int', logger: () => {}});
    }
  })();
  ESC_FOTO.cargando.catch(() => {}).finally(() => { ESC_FOTO.cargando = null; });
  return ESC_FOTO.cargando;
}
const efError = msg => { const e = new Error(msg); e.escudo = true; return e; };
const efImg = src => new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
function efAlerta(cats, nivel, detalle){
  try { S.alertas.unshift({id:'al'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), t:Date.now(), quien:S.yo, para:null, lugar:'foto', texto:'Foto bloqueada antes de subir: '+detalle, cats, nivel, oculto:false, intentos:1, accion:'Foto no subida', estado:'nueva'}); save(); } catch(e){}
}
// palabras de OCR que solo cuentan si son claras (evita que basura del OCR bloquee fotos normales)
const EF_APPS = /(whats\s*app|whatsap|wasap|watsap|guasap|telegram|instagram|tiktok|snapchat|facebook|onlyfans|discord|gmail|hotmail|outlook)/;
async function revisarFoto(dataUrl){
  if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image')) return;
  if (!ESC_FOTO.modelo || !ESC_FOTO.ocr) toast('Revisando la foto…');
  try { await prepararEscudoFoto(); }
  catch(e){ if (VIVO) throw efError('No pudimos revisar la foto (revisa tu internet). Por seguridad, las fotos no se suben sin revisarse. Intenta de nuevo.'); return; }
  const img = await efImg(dataUrl);
  // 1) desnudos o poca ropa
  const pr = {}; (await ESC_FOTO.modelo.classify(img)).forEach(x => pr[x.className] = x.probability);

  if ((pr.Porn||0) > 0.35 || (pr.Hentai||0) > 0.4 || (pr.Sexy||0) > 0.6 || sexual > 0.6){
    efAlerta(['adulto'], 2, `posible desnudo o poca ropa (${Math.round(sexual*100)}%)`);
    throw efError('Esta foto no se puede subir: parece mostrar desnudos o poca ropa. En MOCHI hay menores de edad y eso no está permitido.');
  }
  // 2) texto dentro de la foto
  let texto = '';
  try { const r = await ESC_FOTO.ocr.recognize(img); texto = (r.data.words||[]).filter(w => w.confidence >= 60).map(w => w.text).join(' '); } catch(e){ texto = ''; }
  if (texto.replace(/\s/g,'').length >= 4){
    const v = vistas(texto); const malos = [];
    if (RE_LINK.test(v.base) || RE_LINK.test(v.sinEsp)) malos.push('enlace');
    if (RE_MAIL.test(v.base) || RE_MAIL.test(v.sinEsp)) malos.push('correo');

    if (EF_APPS.test(v.base) || EF_APPS.test(v.pegado)) malos.push('contacto');

    if (malos.length){
      efAlerta(malos, Math.max(...malos.map(b => NIVEL[b]||1)), 'texto en la foto: ' + texto.slice(0,120));
      throw efError(malos.some(b => ['enlace','correo','teléfono','contacto'].includes(b))
        ? 'Esta foto tiene escrito un teléfono, correo, enlace o cuenta de otra app. En MOCHI todo se platica aquí adentro, así que no se puede subir.'
        : 'Esta foto tiene texto que no cumple las reglas de la comunidad, así que no se puede subir.');
    }
  }

function vGuardar(){
  if (!S || S===SDEMO || !SNAP) return;
  try { if (S.carrito) localStorage.setItem('lm-vivo-carrito-'+vUid(), JSON.stringify(S.carrito)); else localStorage.removeItem('lm-vivo-carrito-'+vUid()); } catch(e){}
  try { localStorage.setItem('lm-vivo-yo-'+vUid(), S.yo); } catch(e){}
  const antes = SNAP, ahora = vFoto(S); SNAP = ahora;
  const ops = vDiff(antes, ahora);
  if (!ops.length) return;
  VQ.cola = VQ.cola.then(async ()=>{
    let cambio = false, error = null;
    for (const op of ops){ try { if (await op()) cambio = true; } catch(e){ error = error || e; console.warn('vivo', e); } }
    if (error){ toast(vMsgError(error)); await vRecargar(true); return; }
    if (cambio){ SNAP = vFoto(S); vRefrescar(); }
    if (S.productos.some(p=>!p.sid && !p.enviando && S.misNegocios.includes(p.neg))) setTimeout(()=>{ VQ.cola.then(()=>vGuardar()); }, 400);
  });
  return VQ.cola;
}
function vMsgError(e){ const m = rErr(e); if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para hacer eso.'; return m || 'No se pudo guardar. Intenta otra vez.'; }
const vIdx = (l, k='id') => { const m = new Map(); l.forEach(x=>m.set(x[k], x)); return m; };
async function vSubir(f, carpeta){ // f = {m:clave} con foto en MEDIA (data:) → ruta en Storage
  const d = f && f.m && MEDIA[f.m];
  if (f && f.m && String(f.m).startsWith('s:')) return String(f.m).slice(2);
  if (!d || !String(d).startsWith('data:')) throw new Error('En vivo solo puedes usar tus propias fotos.');
  const blob = await (await fetch(d)).blob(); const ruta = `${vUid()}/${carpeta||''}${crypto.randomUUID()}.jpg`;
  const {error} = await RV.sb.storage.from('fotos').upload(ruta, blob, {contentType:'image/jpeg'}); if (error) throw error;
  MEDIA['s:'+ruta] = d; return ruta;
}

/* ---------- predicción del estado (el servidor tiene la última palabra) ---------- */
function vPredecirEstado(item, tipoItem){
  const ev = evaluar(item, tipoItem);
  if (ev.d==='rechazado'){ item.estado = 'rechazado'; item.motivo = ev.motivo; return 'rechazado'; }
  const esN = esNeg(item.autor); const u = usr(S.personal);
  const aprob = S.posts.filter(p=>p.autor===S.personal && p.estado==='aprobado').length;
  item.estado = (vEsAdmin() || (esN && !S.cfg.revisarNeg) || (S.cfg.autoMod && aprob>=3 && !(u&&u.strikes))) ? 'aprobado' : 'pendiente';
  return item.estado;
}

/* ---------- entrar, recargar, salir ---------- */
async function vEntrar(){
  if (VIVO && S===SV && SV){ render(); return; }
  if (!VQ.listo){
    $('#app').innerHTML = `<div class="rwrapv"><div class="protobar rprotobar"><b>En vivo</b><span>Cargando tu cuenta…</span></div><div class="rcentro"><div class="rspin"></div><p class="muted">Conectando…</p></div></div>`;
    try { await vCargar(); } catch(e){ console.error(e); RV.fase='sinred'; return renderReal(); }
    VQ.listo = true; vCanal(true); setTimeout(()=>{ if (typeof revisarLegal==='function') revisarLegal(); }, 800);
    clearInterval(VQ.intervalo); VQ.intervalo = setInterval(()=>{ if (VIVO && document.visibilityState==='visible' && Date.now()-VQ.ultimaCarga>240000) vRecargar(); }, 30000);
  }
  if (ui.mode!=='real' && ui.mode!=='app' && ui.mode!=='admin') return; // está viendo la demo

  if (VIVO){ VIVO = false; S = SDEMO; document.body.classList.remove('vivo'); } }
async function vRecargar(forzar){
  if (!VQ.listo || !RV.user) return;
  const era = S===SV; try { await vCargar(); } catch(e){ console.warn(e); return; }
  if (VIVO && era){ S = SV; vRefrescar(forzar); }
}
let vPronto = null; function vRecargarPronto(){ clearTimeout(vPronto); const falta = Math.max(1200, 20000 - (Date.now() - VQ.ultimaCarga)); vPronto = setTimeout(()=>vRecargar(), falta); }
// aviso nuevo sin volver a descargar todo (likes, comentarios, seguidores…)
function vAvisoLigero(n){
  if (!VIVO || !SV || !n) return false;
  if (['pedido','sistema','follow_neg'].includes(n.tipo)) return false;
  if (SV.notifs.some(x=>x.sid===n.id)) return true;
  SV.notifs.unshift({id:'n'+n.id, sid:n.id, para:SV.personal, tipo:n.tipo, de:n.de?'u'+n.de:null, post:n.post?'q'+n.post:undefined, hist:n.hist?'h'+n.hist:undefined, texto:n.texto, t:vMs(n.created_at), leida:!!n.leida, compartida:!!n.compartida});
  if (n.de && !SV.usuarios.some(u=>u.id==='u'+n.de)) return false; // alguien nuevo: hace falta su perfil
  if (n.tipo==='follow') SV.sigue.push({de:'u'+n.de, a:SV.personal});
  SNAP = vFoto(SV); vRefrescar(); return true;
}
function vRefrescar(forzar){
  if (!VIVO) return;
  const a = document.activeElement; const escribiendo = a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA') && a.type!=='checkbox' && a.type!=='radio' && a.value;
  // nunca borrar un formulario a medio llenar (producto, publicación, historia, nota, mensaje…)
  const conDatos = [...document.querySelectorAll('#app form input, #app form textarea, #layer form input, #layer form textarea')].some(e=>e.type!=='checkbox' && e.type!=='radio' && e.type!=='hidden' && (e.type==='file' ? e.files && e.files.length : e.value));
  const formAbierto = ui.edit || (ui.sheet && ['publicar','historia','nota','apelar','enviarHist','reportar','verNota','compartir'].includes(ui.sheet.t)) || (ui.draft && ui.draft.length) || ui.draftH || (ui.draftPF && ui.draftPF.length && ui.edit);
  if ((escribiendo || conDatos || formAbierto) && !forzar){ vRefrescar.pendiente = true; clearTimeout(vRefrescar.t); vRefrescar.t = setTimeout(()=>{ if (vRefrescar.pendiente) vRefrescar(); }, 8000); return; }
  vRefrescar.pendiente = false;
  if (ui.story){ renderStory(); return; }
  const y = window.scrollY; render(); if (ui.sheet || ui.sel) renderLayer(); window.scrollTo(0, y);
}
document.addEventListener('focusout', ()=>{ if (vRefrescar.pendiente) setTimeout(()=>vRefrescar(), 300); });
function vCanal(on){
  if (VQ.canal){ try { RV.sb.removeChannel(VQ.canal); } catch(e){} VQ.canal = null; }
  if (!on || !RV.sb || !RV.user) return; const uid = vUid();

    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'messages', filter:`para=eq.${uid}`}, ()=>vRecargarPronto())

    .on('postgres_changes', {event:'INSERT', schema:'public', table:'notifs', filter:`para=eq.${uid}`}, p=>{ const n = p.new; if (n.tipo==='pedido') toast('🛍️ '+(n.texto||'Nuevo pedido')); else if (n.tipo==='sistema' && /pedido/i.test(n.texto||'')) toast(n.texto); if (!vAvisoLigero(n)) vRecargarPronto(); })

}

function redimensionarBase(file, max, cuadrado){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let sx=0,sy=0,sw=img.width,sh=img.height;
  if (cuadrado){ const k=Math.min(sw,sh); sx=(sw-k)/2; sy=(sh-k)/2; sw=sh=k; c.width=c.height=max; } else { const e=Math.min(1,max/Math.max(sw,sh)); c.width=Math.round(sw*e); c.height=Math.round(sh*e); }
  c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; img.onerror=()=>rej(new Error('img')); img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
// Al redibujar la foto en un canvas se eliminan los metadatos (EXIF), incluida la ubicación GPS.
// Después pasa por el escudo de fotos (desnudos y texto con teléfonos/enlaces/otras apps).
async function redimensionar(file, max, cuadrado){ const d = await redimensionarBase(file, max, cuadrado); if (typeof revisarFoto==='function') await revisarFoto(d); return d; }
async function leerFotos(input, limite){ leerFotos.err=''; const files=[...(input.files||[])].filter(f=>f.type.startsWith('image/')).slice(0,limite); const out=[]; for (const f of files){ if (f.size>25*1024*1024) continue; try { out.push({m:await redimensionar(f,1080,false)}); } catch(e){ if (e && e.escudo){ leerFotos.err=e.message; continue; } throw e; } } try { input.value=''; } catch(e){} return out; }
async function guardarFoto(d){ if(!d.m) return d; const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); if(!IDB.db) await IDB.open(); await IDB.put(id,d.m); MEDIA[id]=d.m; return {m:id}; }

    const r=revisar(g('g-nombre')+' '+g('g-desc'),'publico'); if(!r.ok) return fail(msgBloqueo(r));
    let zonas; try { zonas=parseZonas($('#g-zonas').value); } catch(e){ return fail(e.message); }
    Object.assign(n,{nombre:g('g-nombre'),tipo:g('g-tipo'),telefono:g('g-tel'),direccion:g('g-dir'),horario:g('g-hor'),tiempo:g('g-tiempo'),color:g('g-color'),desc:g('g-desc'),
      envio:Math.round((+g('g-envio')||0)*100), envioGratis:Math.round((+g('g-gratis')||0)*100), pedidoMin:Math.round((+g('g-min')||0)*100), zonas,
      secciones:g('g-secs').split(',').map(s=>s.trim()).filter(Boolean), entrega:$('#g-ent').checked, recoger:$('#g-rec').checked});
    if(!n.entrega&&!n.recoger) n.recoger=true; log(n.nombre,'Perfil y envíos actualizados',''); ui.err=''; save(); render(); toast('Perfil guardado');
  },
  ajustes: () => {
    S.cfg.marca=$('#a-marca').value.trim()||'MOCHI'; S.cfg.ciudad=$('#a-ciudad').value.trim()||'Los Mochis';
    S.cfg.comisionBps=Math.round((+$('#a-com').value||0)*100); S.cfg.planCents=Math.round((+$('#a-plan').value||0)*100);
    S.cfg.strikesMax=Math.max(1,Math.round(+$('#a-strikes').value||3)); S.cfg.umbralReportes=Math.max(1,Math.round(+$('#a-umbral').value||3)); S.cfg.revisarNeg=$('#a-revneg').checked;
    log('Admin','Ajustes','Actualizados'); save(); render(); toast('Ajustes guardados');
  }
};

/* ---------- eventos ---------- */
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if(!el) return; const fn = A[el.dataset.a]; if(fn) fn(el.dataset.x, el, e); });
document.addEventListener('dblclick', e => { const c = e.target.closest('[data-dbl]'); if(!c) return; const id=c.dataset.dbl; if(!leGusta(id)) A.like(id, {dataset:{o:c.closest('article')?.dataset.por||''}}); else { const bh=$('#bh-'+id); if(bh){ bh.classList.remove('go'); void bh.offsetWidth; bh.classList.add('go'); } } });
document.addEventListener('submit', e => { const f=e.target.dataset.form; if(f){ e.preventDefault(); F[f](); } });
document.addEventListener('focusin', e => { if(e.target.id==='st-resp' && ui.story) ui.story.paused=true; });
document.addEventListener('input', e => {
  if (e.target.id==='q'){ ui.q=e.target.value; const r=$('#results'); if(r) r.innerHTML = (ui.view==='buscar' || ui.q.trim()) ? resultados() : ''; }
  if (e.target.id==='qm'){ ui.qm=e.target.value; const busca=!!ui.qm.trim(); const r=$('#dm-res'); if(r) r.innerHTML=resultadosMsg(); document.querySelectorAll('.dm-list .notes, .dm-list .dm-sub:not(.dm-res .dm-sub)').forEach(el=>el.hidden=busca); document.querySelectorAll('.dm-list > .crow').forEach(el=>el.hidden=busca); if(!busca && !document.querySelector('.dm-list > .crow')){ render(); const i=$('#qm'); if(i){ i.focus(); } } }
  if (e.target.id==='sheet-note' && ui.sel) ui.sel.note=e.target.value;
  if (e.target.id==='pub-txt'){ ui.draftTxt=e.target.value; const ta=e.target, pos=ta.selectionStart, m=ta.value.slice(0,pos).match(/@([^\s@]{1,30})$/); const s=$('#tag-sug'); if(s) s.innerHTML = m ? sugHTML(sugerencias(m[1]),'tagPub') : ''; }
  if (e.target.id==='ht-q'){ const s=$('#ht-sug'); if(s) s.innerHTML = sugHTML(sugerencias(e.target.value),'tagHist'); }
  if (e.target.id==='f-oferta') actualizarTotales();
});
document.addEventListener('change', async e => {
  const t=e.target;
  if (t.id==='solo-disp'){ ui.soloDisp=t.checked; rerender(); }
  if (t.dataset && t.dataset.ch && A[t.dataset.ch]) A[t.dataset.ch](t.value);
  if (t.name==='modo' || t.id==='f-col' || t.id==='f-oferta') actualizarTotales();
  if (t.id==='pub-files'){ guardarBorrador(); try { const nuevas = await leerFotos(t, 10-ui.draft.length); ui.draft.push(...nuevas.slice(0,10-ui.draft.length)); ui.err=leerFotos.err||''; } catch(err){ ui.err='No se pudo leer una de las fotos.'; } renderLayer(); }
  if (t.id==='e-fotos'){ try { const nuevas = await leerFotos(t, 4-(ui.draftPF||[]).length); ui.draftPF = (ui.draftPF||[]).concat(nuevas).slice(0,4); ui.err=leerFotos.err||''; if (ui.err) toast(ui.err); } catch(err){ ui.err='No se pudieron leer las fotos.'; } renderConservando(); }
  if (t.id==='hist-file' && t.files[0]){ try { ui.draftH={m:await redimensionar(t.files[0],1080,false)}; ui.err=''; } catch(err){ ui.err=err&&err.escudo?err.message:'No se pudo leer la foto.'; try { t.value=''; } catch(e){} } renderLayer(); }
});
document.addEventListener('scroll', e => {
  const tr = e.target; if (!(tr instanceof Element) || !tr.dataset || !tr.dataset.car) return;
  const i = Math.round(tr.scrollLeft / tr.clientWidth); const id = tr.dataset.car;
  const n = $('#cn-'+id); if (n) n.textContent = `${i+1}/${tr.children.length}`;
  document.querySelectorAll('#cd-'+id+' i').forEach((d,k)=>d.classList.toggle('on',k===i));
}, true);
document.addEventListener('keydown', e => {
  if (ui.story && e.target.id!=='st-resp'){ if(e.key==='Escape') return cerrarStory(); if(e.key==='ArrowRight') return stMover(1); if(e.key==='ArrowLeft') return stMover(-1); }
  if (e.key==='Escape' && (ui.sel||ui.pend||ui.sheet)){ ui.sel=null; ui.pend=null; ui.sheet=null; renderLayer(); }
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(PREF.tema==='sistema') rerender(); }); } catch(e){}
Object.assign(A, {
  alSusp: x => { const u=usr(x); u.suspendido=true; log('Admin','Suspendió cuenta','@'+u.usuario); save(); rerender(); toast('Cuenta suspendida'); },
  alQuitar: x => { const u=usr(x); u.suspendido=false; delete S.pausas[x]; log('Admin','Quitó suspensión','@'+u.usuario); save(); rerender(); toast('Suspensión retirada'); },
  alDesc: x => { const a=S.alertas.find(a=>a.id===x); a.estado='descartada'; log('Admin','Descartó alerta',x); save(); rerender(); },
  alDen: x => { const a=S.alertas.find(a=>a.id===x); a.estado='denunciada'; const u=!esNeg(a.quien)&&usr(a.quien); if(u) u.suspendido=true; log('Admin','Alerta marcada como denunciada',x); save(); rerender(); toast('Marcada como denunciada. Conserva la evidencia.'); },
  probarEscudo: () => { const t=$('#esc-prueba').value, l=$('#esc-lugar').value; ui.prueba={t, r:analizarTexto(t, l, {paraMenor:l==='privado'})}; rerender(); },
  termAdd: () => { const t=$('#term-t').value.trim().toLowerCase(), c=$('#term-c').value; if(t.length<3) return toast('Escribe al menos 3 letras'); S.cfg.terminos.push({t:limpiarTexto(t), cat:c}); CACHE_RE.clear(); log('Admin','Agregó término al Escudo',c); save(); rerender(); },
  termDel: x => { S.cfg.terminos.splice(+x,1); save(); rerender(); }
});
registrarAccionesReparto(); registrarAccionesExtras(); registrarAccionesV12(); registrarAccionesReal(); registrarAccionesV17(); registrarAccionesV18(); registrarAccionesLegal(); registrarAccionesVivo();
aplicarPref();
const EN_VIVO_OK = /github\.io$/.test(location.host) || /[?&]vivo=1/.test(location.search);
try { if (EN_VIVO_OK && (localStorage.getItem('lm-modo')||'real')==='real') ui.mode='real'; } catch(e){ if (EN_VIVO_OK) ui.mode='real'; }
render();
cargarFotos();

</script>
